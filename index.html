<style>
/* Layout: UNO style. Black, white, one red accent. A thin top bar, a row of page buttons,
   then one page at a time in a single readable column. */
:root{
  --bg:#ffffff; --fg:#111111; --muted:#5f5f5f; --line:#e3e3e3; --soft:#f4f4f4; --red:#c8102e; --ok:#1e6b3a; --invert:#111111; --invert-fg:#ffffff;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0f0f; --fg:#f2f2f2; --muted:#a6a6a6; --line:#2c2c2c; --soft:#1b1b1b; --red:#ff4d63; --ok:#5fcf8a; --invert:#f2f2f2; --invert-fg:#0f0f0f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f0f0f; --fg:#f2f2f2; --muted:#a6a6a6; --line:#2c2c2c; --soft:#1b1b1b; --red:#ff4d63; --ok:#5fcf8a; --invert:#f2f2f2; --invert-fg:#0f0f0f; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.top{border-bottom:1px solid var(--line);padding:12px 16px}
.top .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{font-size:15px;letter-spacing:.02em}
.top span{color:var(--muted);font-size:14px}
.top .grow{flex:1}
nav{max-width:860px;margin:0 auto;padding:12px 16px 0;display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:14px;white-space:nowrap}
nav button[aria-current="true"]{background:var(--invert);color:var(--invert-fg);border-color:var(--invert)}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:2px}
main{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:8px 64px}
.eyebrow{color:var(--red);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-top:28px}
h1{font-size:30px;line-height:1.2;margin:6px 0 14px;text-wrap:balance;font-weight:700}
h2{font-size:20px;margin:34px 0 10px;text-wrap:balance;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:16px;margin:20px 0 6px}
p{margin:0 0 10px;max-width:68ch}
ul,ol{margin:0 0 12px;padding-left:22px} li{margin:3px 0}
.lead{font-size:18px}
.muted{color:var(--muted)}
.tablewrap{overflow-x:auto;margin:8px 0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--invert);color:var(--invert-fg);text-align:left;font-weight:600;padding:7px 10px}
td{border-bottom:1px solid var(--line);padding:7px 10px;vertical-align:top}
td.t{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.step{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:18px 0}
.step .n{font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.step .b{min-width:0}
.prompt{background:var(--soft);border-left:3px solid var(--fg);border-radius:4px;margin:8px 0 4px;padding:12px 14px}
.prompt pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.prompt .row{margin-bottom:8px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{background:var(--invert);color:var(--invert-fg);border:0;border-radius:6px;padding:7px 13px;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;font-size:15px;line-height:1.5}
textarea{resize:vertical}
textarea:focus,input[type=text]:focus{border-color:var(--fg);outline:none}
.answer{margin-top:8px}
.answer textarea{min-height:90px;font-size:14px}
.tip{font-size:14px;color:var(--muted);margin:6px 0 0}
.tip b{color:var(--red)}
.box{border-left:3px solid var(--red);background:var(--soft);padding:12px 14px;border-radius:4px;margin:12px 0}
.box pre{margin:6px 0 0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.box h3{margin:0}
.checks label{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:15px}
.checks input{margin-top:5px;width:16px;height:16px;accent-color:var(--red);flex:none}
.cardform{display:grid;gap:12px;margin:12px 0}
.cardform label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.cardform .hint{font-weight:400;color:var(--muted);font-size:13px}
.cardform textarea{min-height:52px}
/* Choice buttons: quiz options, Yes / Partly / No, decisions */
.opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 12px;font-size:15px}
.opt[aria-pressed="true"]{background:var(--invert);color:var(--invert-fg);border-color:var(--invert)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.feedback{font-size:14px;margin:4px 0 0;padding:8px 12px;border-radius:6px;background:var(--soft)}
.feedback b.ok{color:var(--ok)} .feedback b.no{color:var(--red)}
.q{margin:18px 0}
.q .qt{font-weight:600}
.rate{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rate .opts{margin:0}
.rate .opt{padding:5px 10px;font-size:13px}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.export{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:24px 0 0}
.dashframe{display:block;width:100%;min-height:420px;border:1px solid var(--line);border-radius:8px;margin-top:12px;background:var(--bg)}
textarea.mono{font-family:var(--mono);font-size:13px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:14px;flex-wrap:wrap}
.foot{color:var(--muted);font-size:13px;margin-top:24px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--invert);color:var(--invert-fg);padding:8px 14px;border-radius:6px;font-size:14px;z-index:5;max-width:90vw}
@media (max-width:560px){ .rate{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

const DATA = {"course": "AI for Project Managers", "subtitle": "Hands-on labs: launch a small website with AI", "card": [["Project", "A new website for Maple Street Bakery."], ["Goal", "Customers can see the menu and opening hours, and ask for a custom cake online."], ["What we will build", "A 5-page website: Home, Menu, About, Contact and Cake Orders (a request form, no online payment)."], ["Deadline", "The website goes live at the end of week 9."], ["Budget", "$8,000 in total."], ["People", "You are the project manager. Maria owns the bakery; she pays and approves. Sam is a freelance web designer who builds the site. Jo works in the bakery and writes the text and takes the photos."], ["Limits", "The bakery has no IT staff. Maria can only review work on Mondays. Jo works in the shop most of the day."]], "deliverables": [["Lab 1", "Project charter", "Toolkit page 1", "One page. Every TO CONFIRM is fixed from Maria's answers. Online payment is out of scope. Week 9 and $8,000 are right."], ["Lab 1", "Stakeholder list", "Toolkit page 1", "Includes customers and bakery staff. No invented people with names."], ["Lab 2", "Scope statement (in and out)", "Excel 1 Scope", "Online payment, delivery, a loyalty programme and social media are out."], ["Lab 2", "Task list", "Excel 2 Tasks", "15 to 20 tasks. Each has one owner: Project manager, Maria, Sam or Jo. Building the pages takes about 8 to 10 days, not 2."], ["Lab 2", "Schedule (Gantt chart)", "Excel 3 Schedule", "Weeks 1 to 9 only. Red milestones. Building starts after the design is approved. One empty buffer week before the launch."], ["Lab 3", "Budget", "Excel 4 Budget", "Excel says 'OK: within budget'. There is a contingency row of $800."], ["Lab 3", "Risk register and top 3 risks", "Excel 5 Risks, toolkit page 3", "8 risks that fit a small bakery. Excel works out the scores. You chose the top 3 and wrote why."], ["Lab 3", "Communication plan", "Excel 6 Communication", "Maria hears from you weekly, on Mondays. Jo gets short chats in the shop."], ["Lab 4", "Action list", "Excel 7 Actions", "Jo's photos are not agreed. The menu prices and the allergy question show NO OWNER. The only dates are the ones in the notes."], ["Lab 4", "Follow-up email", "Toolkit page 4", "Under 150 words. It asks who will take the open tasks and promises nothing that nobody agreed to."], ["Lab 5", "Status report", "Toolkit page 5", "Yellow, with one reason. Only facts from the week 6 update."], ["Lab 5", "Change request", "Toolkit page 5", "Keeps $1,200 and 2 weeks. At least 3 options. Shows the $800 contingency is $400 short. Maria decides."], ["Event", "Response to a surprise event", "Toolkit page 5b, Excel 5 Risks", "Says what kind of problem it is. 3 options whose numbers match the facts. A message to Maria under 80 words that leaves the decision to her."], ["Lab 6", "Project dashboard", "Downloaded dashboard file, toolkit page 6", "Every number matches your Excel: $4,900 of $8,000 is 61% used, $3,100 left. No red box in the builder. The colour matches your status report."], ["Lab 7", "Lessons learned", "Toolkit page 7", "3 lessons, each from the end-of-project notes: what happened, why, and what we do next time."], ["Lab 7", "Closing email", "Toolkit page 7", "Final cost $7,650. It asks Maria to accept the website. It does not say she already has."]], "recipe": [["Role", "Who should the AI act as?", "You are an experienced project manager helping a beginner."], ["Task", "What exactly should it make?", "Write a one-page project charter."], ["Context", "What does it need to know?", "Here is my project card: [paste your project card]"], ["Format", "How should the answer look?", "Use these headings ... Keep it under 400 words."], ["Check", "What rules must it follow?", "Use only facts from my project card. If something is missing, write TO CONFIRM."]], "guide": [["Did it do the job I asked for?", "Is it the right document, in the format and length I asked for?"], ["Can I find every fact in the project card or the notes?", "Highlight anything new. New facts are often made up."], ["Are the numbers right?", "Add up the totals yourself. Check that weeks and dates are in order."], ["Is it realistic?", "Could these people really do this, in this time, for this money?"], ["Is anything important missing?", "Think about the people, the deadline and the limits on your card."], ["Is it clear for the person who will read it?", "Would Maria, or your team, understand it in one read?"], ["Is it safe to share?", "No private, personal or confidential information."], ["Would I put my name on it?", "You are responsible for it, not the AI."]], "decision": ["Use it as it is", "Use it after I fix it", "Ask again with a better prompt"], "excel": ["One item per row, and every column filled in.", "Every task has exactly one owner.", "Totals come from an Excel SUM formula, not from the AI's number.", "Weeks are numbers between 1 and 9, and start weeks come before end weeks."], "word": ["The headings match what you asked for.", "The length and tone fit the reader.", "It makes no promise you cannot keep."], "safety": ["Never paste real names of customers, clients or patients.", "Never paste personal details: addresses, phone numbers, health information, salaries.", "Never paste passwords, contracts, or company numbers that are not public.", "Today everyone uses the made-up bakery project, so there is nothing private to paste. Back at work, describe a project in general terms: roles instead of names, rough numbers instead of real ones.", "Follow your company's AI rules. A free account is not a company-approved tool."], "agenda": ["Welcome: project management in 15 minutes", "Opening demo: what AI can really do in a project", "Lab 1  Start the project: compare prompts and write the charter", "Lab 2  Plan the work in Excel: scope, tasks and schedule", "Lab 3  Money, risks and communication", "Lab 4  Run the project: meetings and action items", "Lab 5  Track and control: status report and change request", "Surprise event: news for your project", "Lab 6  The project dashboard", "Lab 7  Close the project", "Final evaluation and hand in"], "labs": [{"num": 1, "title": "Start the project: compare prompts and write the charter", "phase": "Phase 1: Start", "can": ["Compare three prompts for the same job and choose the best one with evidence.", "Write a project charter that the sponsor can sign.", "Make a stakeholder list."], "pm": "Every project starts with a project charter. It is one page that says why we are doing the project, what we will deliver, by when, for how much, and who decides. The sponsor (Maria) signs it. A stakeholder is anyone who is affected by the project or can affect it.", "need": ["The project card: in this guide, or the 'Project card' page in the web lab.", "Maria's answers (in the box below).", "Toolkit page 1."], "steps": [["Read the project card for Maple Street Bakery. Everyone uses this same project today, so you can compare your answers with your neighbour's. You paste the card into the AI once, in Prompt C. After that, your project chat remembers it.", null, "In the web lab, the Copy button puts the card into the prompt for you."], ["Open a new chat. Run Prompt A, the short one, exactly as written:", "Write a project charter for a bakery website.", null], ["Copy the answer into your toolkit under Prompt A.", null, null], ["Open a new chat. Run Prompt B, which adds the project card, exactly as written:", "Here is my project card:\n[paste your project card]\nWrite a project charter.", null], ["Copy the answer into your toolkit under Prompt B.", null, null], ["Open a new chat. Run Prompt C, the full recipe, exactly as written. Keep this chat open: it is your project chat for the rest of the day.", "Role: You are an experienced project manager helping a beginner.\nTask: Write a one-page project charter.\nContext: Here is my project card:\n[paste your project card]\nFormat: Use these headings: Purpose, Goal and success measures, Scope (in and out), Deliverables, Timeline (milestones by week), Budget, People and roles, Main risks, Approval. Keep it under 400 words.\nCheck: Use only facts from my project card. If something is missing, write TO CONFIRM instead of making it up. At the end, list 3 questions I should ask the sponsor.", null], ["Copy the answer into your toolkit under Prompt C.", null, "Whichever prompt wins, keep working in the Prompt C chat. It already has the project card and the full recipe."], ["Fill in the comparison table in your toolkit. Give each answer 1, 2 or 3 points for each question. Add up the points and circle the winner.", null, "A long answer is not always a better answer. Look for made-up facts."], ["Fix the winning charter. Replace every TO CONFIRM with a fact from Maria's answers (the box above). If Maria's answers do not cover it, leave TO CONFIRM and add it to your questions for Maria. Do not make up an answer yourself.", null, "This is the same rule you gave the AI: no facts that nobody gave you."], ["In your project chat, give the AI Maria's answers, so it knows them for the rest of the day:", "Here are Maria's answers to my questions. Use them from now on, together with the project card.\n[paste Maria's answers]", null], ["In the same chat, make the stakeholder list:", "Make a stakeholder table for this project with these columns: Stakeholder, Role, What they care about, Influence (high, medium or low), How we keep them informed.\nInclude groups outside the team who are affected, such as customers. Do not invent new people with names.", null], ["Check the table with the question guide. Copy the fixed version into your toolkit.", null, null], ["Swap toolkits with your neighbour. Pretend you are Maria. Would you sign their charter? Tell them one thing to fix.", null, null]], "checked": "the charter from Prompt C and the stakeholder list, as the AI wrote them (before you fixed them)", "checks": ["The charter has no numbers or goals that are not on the project card (for example 'increase sales by 30%').", "Online payment is out of scope, not in scope.", "The deadline (end of week 9) and the budget ($8,000) are right.", "Anything the card does not say is marked TO CONFIRM, not made up.", "Customers are on the stakeholder list.", "The stakeholder list has no invented people with names."], "save": "Toolkit page 1: the three charters, the comparison table, your final charter and the stakeholder list.", "evalq": ["Which prompt won, and what made it better?", "What did Prompt A make up?", "What will you always put in a prompt from now on?"]}, {"num": 2, "title": "Plan the work in Excel: scope, tasks and schedule", "phase": "Phase 2: Plan", "can": ["Write a scope statement: what is in and what is out.", "Break the project into tasks with owners and days of work.", "Build a 9-week schedule with milestones in Excel.", "Check AI tables with Excel instead of trusting them."], "pm": "Scope means what is in the project and what is not. Writing it down protects you when someone asks for 'just one more thing'. A task list breaks the big job into small pieces, each with one owner. A schedule says when each task happens. A milestone is a checkpoint, like 'design approved'. We plan in Excel because Excel can sort, add up and update the plan for us.", "need": ["Your project chat from Lab 1 (the Prompt C chat).", "Maria's answers (Lab 1).", "The Excel file 3_Website_Project_Planner.xlsx.", "The schedule template (in the box below, and the file 11_AI_Template_Schedule.txt to attach).", "Toolkit page 2."], "steps": [["In your project chat, ask for the scope:", "Write a scope statement for this project as two lists: In scope and Out of scope.\nThen ask me up to 3 questions about anything that is still unclear. Wait for my answers before you finish.", null], ["Answer the AI's questions in the chat, using the project card and Maria's answers from Lab 1. If neither has the answer, type TO CONFIRM. Then copy the final two lists into the sheet 1 Scope in Excel.", null, "If the AI answers its own questions instead of waiting, that is a made-up answer. Tell it: 'Please wait for my answers.'"], ["In the same chat, ask for the task list:", "Using the project card, Maria's answers and this scope, break the project into 15 to 20 tasks.\nMake a table with these columns, in this order: ID, Phase, Task, Owner, Days of work, Depends on.\nPhases: Plan, Design, Content, Build, Test and launch.\nOwners can only be: Project manager, Maria, Sam, Jo.\nUse realistic days of work for a small business. Write the ID as T1, T2 and so on.", null], ["Copy the table into Excel. In ChatGPT, move your mouse over the table and click the copy button (or select the whole table and press Ctrl+C). In Excel, open the sheet 2 Tasks, click cell A1 and press Ctrl+V. The AI's column names go into row 1, and row 2 is your first task. This sheet has no bars: the timeline comes later, on sheet 3 Schedule.", null, "If everything lands in column A, ask the AI: 'Give me the same table as tab-separated text in a code block.' Copy it and paste again into A1."], ["Check the tasks in Excel. Click the filter arrow on Owner and look at one person at a time. Does Jo have too much work while she runs the shop? Does Maria only have reviews and approvals?", null, null], ["In the same chat, ask for the schedule. The AI needs the schedule template: the Copy button below already puts it into the prompt. If you are signed in to your AI chat, you can attach the file 11_AI_Template_Schedule.txt instead (the paperclip or + button). Without an account, ChatGPT does not take files, so use the Copy button.", "Fill in this schedule template for weeks 1 to 9, using our task list. Follow every rule in the template, and keep week 8 empty. Reply with only the filled-in table.\n\n[paste the schedule template]", "The template already has the five milestone rows and the column names that sheet 3 needs, so the bars come out the same for everyone. If you attached the file, you do not need to paste it too."], ["Copy the schedule into the sheet 3 Schedule: click cell A1 and press Ctrl+V. The bars appear by themselves: black for tasks, red for milestones. That is your timeline (a Gantt chart).", null, "No bar on a row? Look at column N (Check): it says what is wrong. A milestone bar is black, not red? Its name must start with 'Milestone' or its ID with M."], ["Check the schedule with the question guide and the Excel checks. Fix anything wrong by typing in Excel.", null, "Look for: building before the design is approved, tasks after week 9, no empty buffer week, and extra rows the template does not allow (a 'Buffer' row draws a black bar in the buffer week: delete it). If the AI writes a note under its table about a problem, the table is often still wrong. Ask it: 'Please fix the table itself, not just the note.'"]], "checked": "the scope, the task list and the schedule as the AI wrote them (before you fixed them in Excel)", "checks": ["Online payment is out of scope.", "Every task has one owner, and the owners are only Project manager, Maria, Sam and Jo.", "Building the pages takes a realistic time (about 8 to 10 days), not 2 or 3.", "Building starts after the design is approved.", "Every Maria review starts the week after the work it reviews.", "Nothing ends after week 9, and there is an empty buffer week before the launch (no task and no \"Buffer\" row in it).", "There is one row for every task, then M1 to M5, and no other rows.", "The milestone names start with 'Milestone', so they show as red bars."], "save": "Excel sheets 1 Scope, 2 Tasks and 3 Schedule. Toolkit page 2: what you fixed and why.", "evalq": ["What did the AI plan that was not realistic?", "What did Excel show you that the chat did not?", "If the design approval slips by one week, what changes in your schedule?"]}, {"num": 3, "title": "Money, risks and communication", "phase": "Phase 2: Plan", "can": ["Make a budget with a contingency and check the total in Excel.", "Make a risk register and choose the top risks.", "Make a communication plan that fits the people's limits."], "pm": "A budget shows where the money goes. A contingency is spare money for surprises, often 10%. A risk is something that might go wrong. A risk register lists each risk, how likely it is, how bad it would be, and what we will do about it. A communication plan says who gets which update, how and how often.", "need": ["Your project chat.", "Excel sheets 4 Budget, 5 Risks and 6 Communication.", "Toolkit page 3."], "steps": [["In your project chat, ask for the budget:", "Make a budget table for this project with these columns, in this order: Item, What it pays for, Cost (USD), How you estimated it.\nWrite the cost as a number only, like 600.\nInclude a 10% contingency as its own row. The total must not be more than $8,000.\nDo not put a total row in the table. Write the total on its own line under the table.\nMark every cost as an estimate.", null], ["Paste the table into the sheet 4 Budget: click cell A1 and press Ctrl+V. Look at the Total cell: Excel adds it up for you. Does it match the total the AI wrote under its table? Is it under $8,000?", null, "AI prices are guesses. Ask: 'Which of these costs should I check with a real quote?'"], ["In the same chat, ask for the risks:", "List 8 risks for this project.\nMake a table with these columns, in this order: ID, Risk, Cause, Likelihood (1 to 3), Impact (1 to 3), Response (what we will do), Owner.\nFocus on risks for a small bakery website, not risks for a big company.", null], ["Paste it into the sheet 5 Risks: click cell A1 and press Ctrl+V. Excel works out the score (likelihood times impact). Sort by score and choose your top 3.", null, "Two risks can have the same score. Then you decide which matters more. That is your judgment, not the AI's."], ["In the same chat, ask for the communication plan:", "Make a communication plan table with these columns: Who, What they need to know, How (email, meeting, phone or chat), How often, Who sends it.\nRemember: Maria can only review on Mondays, and Jo works in the shop most of the day.", null], ["Paste it into the sheet 6 Communication at cell A1 and check it.", null, null]], "checked": "the budget, the risks and the communication plan as the AI wrote them", "checks": ["The total the AI wrote matches the Excel total.", "The Excel total is $8,000 or less.", "There is a 10% contingency row.", "The risks fit a small bakery (Maria's Monday reviews, Jo's time, new requests), not a big company.", "The communication plan fits Maria's Mondays and Jo's work in the shop."], "save": "Excel sheets 4, 5 and 6. Toolkit page 3: your top 3 risks and why you chose them.", "evalq": ["Did the AI's total match the Excel total?", "Which risk did the AI miss that you know from your own experience?", "Why should a person, not the AI, choose the top risks?"]}, {"num": 4, "title": "Run the project: meetings and action items", "phase": "Phase 3: Do the work", "can": ["Turn messy meeting notes into a clear action list.", "Spot when the AI turns a 'maybe' into a promise.", "Show that rules in a prompt work as a control, by running the same job with and without them.", "Write a follow-up email and check new requests against the scope."], "pm": "While the team does the work, the project manager runs the meetings and makes sure every task has an owner and a due date. An action item is one task from a meeting: what, who and by when. If nobody owns a task, it usually does not get done.", "need": ["Your project chat.", "The week 3 meeting notes (in the box below).", "Excel sheet 7 Actions.", "Toolkit page 4."], "steps": [["Read the meeting notes yourself first. Underline every task.", null, null], ["Round 1: no rules. In your project chat, run this plain prompt exactly as written:", "Turn these meeting notes into an action table with these columns: Action, Owner, Due.\n\nMeeting notes:\n[paste the meeting notes]", "Round 1 is meant to go wrong. You are finding out what the AI does when nobody gives it rules."], ["Hunt. Compare every row with the notes. In the Round 1 column of your toolkit, count: owners the AI made up, due dates it made up, and 'maybes' it turned into promises.", null, null], ["Round 2: with rules. In the same chat, ask again, this time with rules:", "Now do the same again, but follow these rules.\nUse these columns, in this order: Action, Owner, Due, Did the owner clearly agree? (Yes or No), Note.\nDo not invent owners or dates. If nobody took the task, write NO OWNER. If someone said might or maybe, write No in the agree column.", null], ["Hunt again and fill in the Round 2 column. Which problems did the rules fix? Which were still there? Fix what is left, then paste the table into the sheet 7 Actions at cell A1.", null, "The rules are a control that you, the project manager, add. The AI did not get smarter between the rounds."], ["In the same chat, ask for the follow-up email:", "Write the text of a short, friendly follow-up email to Maria, Sam and Jo that lists these actions. For any action with no owner, ask who will take it. Under 150 words. Do not send it: just write the text here.", null], ["In the same chat, check a new request against the scope:", "Maria wants the cake order form to ask about allergies. Is this request inside the scope we agreed earlier in this chat? Answer in two sentences.", "Small changes inside the scope just become a new task. Big changes need a change request (Lab 5)."]], "checked": "the round 2 action list and the follow-up email as the AI wrote them", "checks": ["Jo's photos are not marked as agreed. She only said 'might'.", "The menu prices show NO OWNER.", "The allergy question shows NO OWNER. Maria asked for it, but nobody took it.", "The only due dates are the ones in the notes (Thursday, next Monday).", "The email does not say anyone agreed to something they did not agree to.", "The email asks who will take each task that has no owner."], "save": "Excel sheet 7 Actions. Toolkit page 4: the round 1 and round 2 counts, the follow-up email and one mistake the AI made.", "evalq": ["What would happen if the round 1 action list was sent without your check?", "Round 1 against round 2: which problems did the rules fix, and which were still there?", "Who should answer the questions in your follow-up email?"]}, {"num": 5, "title": "Track and control: status report and change request", "phase": "Phase 4: Track and control", "can": ["Write an honest weekly status report with a status colour.", "Show how colour rules change the AI's report, by running it with and without them.", "Write a change request so the sponsor can decide.", "Keep the AI to your numbers."], "pm": "Tracking means comparing what really happened with the plan. A status report tells the sponsor where we are: green, yellow or red. Control means not letting the project change by accident. Any change to scope, time or money goes into a change request, and the sponsor decides. Not the project manager, and not the AI.", "need": ["Your project chat.", "The week 6 update, the colour rules and the payment facts (in the boxes below).", "Toolkit page 5."], "steps": [["Round 1: no rules. In your project chat, run this plain prompt exactly as written:", "Write a weekly status report for Maria, the project sponsor. Give it an overall status: Green, Yellow or Red.\n\nUpdates:\n[paste the week 6 update]", "Without rules, AI often says Green ('on track') because the launch date has not moved yet."], ["Hunt. In the Round 1 column of your toolkit, write: the colour it chose, any facts that are not in the update, and any place where it sounds better or worse than the facts.", null, null], ["Round 2: with rules. In the same chat, ask again with the colour rules and the facts-only rule:", "Now rewrite the status report.\nUse these headings: Overall status (Green, Yellow or Red, with one reason), Done this week, Next week, Problems, Decisions needed.\nUse these colour rules:\n[paste the colour rules]\nUse only the facts in the week 6 update. Under 200 words.", null], ["Hunt again and fill in the Round 2 column. Is the colour right under the rules? Did the AI make anything sound better or worse than it is? Fix it, and copy the fixed report into your toolkit.", null, null], ["In the same chat, ask for the change request:", "Maria asked if customers can pay for cakes online. Write a change request with these headings: The change, Why it was asked for, Impact on cost, Impact on schedule, Impact on risk, Options (at least 3), Recommendation, Who decides.\nUse these facts and do not change the numbers:\n[paste the payment facts]", null], ["Check the money yourself: $8,000 minus $4,900 spent is $3,100 left. Can the $800 contingency pay for $1,200? Write your answer in the toolkit.", null, null], ["Update your risk register in Excel: raise the score of the photo risk and add the payment request as a new risk.", null, null]], "checked": "the round 2 status report and the change request as the AI wrote them", "checks": ["The status is Yellow: things are late, but the buffer week can still save the deadline.", "The status report uses only facts from the week 6 update.", "The change request keeps the $1,200 and the 2 weeks from the facts.", "The change request says the $800 contingency does not cover the $1,200.", "The change request leaves the decision to Maria."], "save": "Toolkit page 5: the round 1 and round 2 notes, the status report and the change request, with what you fixed.", "evalq": ["Round 1 against round 2: did the colour rules change the colour? Why?", "Did the AI keep your numbers in the change request?", "Why does the sponsor decide on a change, not the project manager?"]}, {"num": 6, "title": "The project dashboard", "phase": "Phase 4: Track and control", "can": ["Give any AI chat a dashboard template, and get your project's dashboard data back.", "Turn that data into a one-page, interactive dashboard for the sponsor.", "Check every number on the dashboard against Excel."], "pm": "A dashboard is one page the sponsor can read in one minute: the status colour, progress, milestones, budget, top risks, open actions and decisions needed. It pulls together everything you made today. We give the AI a template to fill in, so every dashboard has the same shape, whichever AI you use.", "need": ["Your project chat.", "Anything you fixed in Excel or in your toolkit: the task list, the budget, your top 3 risks, the action list and the status report.", "The dashboard template (in the box below, and the file 11_AI_Template_Dashboard.txt to attach). The web lab puts it into the prompt for you.", "Excel sheet 8 Dashboard.", "Toolkit page 6."], "steps": [["In Excel, open the sheet 2 Tasks. In the Status column, use the week 6 update: type Done for every Plan task, the homepage designs, the design approval, the menu text, the About text and the hosting set-up. Type In progress for building the pages. Leave everything else as Not started. Then open 8 Dashboard and type 4900 in the Spent so far cell. Excel now shows your own numbers.", null, "Your task list is not the same as your neighbour's, so your 'tasks done' number may differ. That is fine. What matters is that the AI's numbers match your own Excel."], ["In your project chat, ask the AI to fill in the dashboard template. The prompt below has the template in it. If you are signed in, you can attach the file 11_AI_Template_Dashboard.txt instead. Under the prompt, paste what you fixed, so the AI uses your versions and not its first drafts.", "Fill in this project dashboard template for week 6, using everything in this chat.\nWhere I fixed your drafts, use my versions below.\nRules: Keep the format exactly. Write one line for every task, milestone, risk, open action and option. Use only facts from this chat and my fixes. If you are not sure about a part, write (?) there. Reply with only the filled-in template, in one code block.\n\n[paste the dashboard template]\n\nWhat I fixed:\n[paste what you fixed]", "This works in ChatGPT, Copilot, Claude, Gemini or any other AI chat. The AI only fills in text, so there is no code to break."], ["Copy the AI's filled-in template. Paste it into the dashboard builder below (or open 10_Project_Dashboard_TEMPLATE.html in your browser), and click Build my dashboard.", null, "A red box at the top means the AI's own numbers do not add up, for example it says 9 tasks are done but marks only 8 as Done. A (?) means the AI was not sure: that is honest, but look up the answer in the week 6 update or your Excel and type it in. Fix the lines in the box, and build again."], ["Compare every number with the Excel sheet 8 Dashboard: tasks done, percent of the budget used, money left. If one is different, fix the line in the builder box and build again.", null, "The dashboard counts and divides for you, but only from the lines the AI wrote. If a task status is wrong, the count is wrong too."], ["Try the dashboard the way Maria would: show the work for one person, click a risk, and click each option for her decision. Then click Download my dashboard, and copy the filled-in template into your toolkit, page 6.", null, null], ["Bonus, if you have time: ask the AI for a one-minute summary.", "Write 3 short sentences Maria can read in one minute, using only the dashboard data you just wrote.", null]], "checked": "the dashboard data the AI filled in", "checks": ["The tasks marked Done match your Excel sheet 2 Tasks.", "The budget line says 8000 approved and 4900 spent, so 61% is used and $3,100 is left.", "The status colour matches your week 6 status report.", "The builder shows no red box: the AI's own counts match the lines it wrote.", "Every risk, action and decision comes from your own documents."], "save": "Toolkit page 6: the filled-in template. Your downloaded dashboard file. Excel sheet 8 Dashboard.", "evalq": ["Did the AI's counts match the lines it wrote? Which ones did not?", "Which part of the dashboard would Maria look at first?", "What would you never let the AI put on a dashboard without checking?"]}, {"num": 7, "title": "Close the project", "phase": "Phase 5: Close", "can": ["Write lessons learned that come only from what happened.", "Write a closing email asking the sponsor to accept the work."], "pm": "Closing means checking everything was delivered, getting the sponsor to accept it, thanking the team and writing down lessons for next time. Lessons learned are the most skipped document, and AI makes them quick to write.", "need": ["Your project chat.", "The end-of-project notes (in the box below).", "Toolkit page 7."], "steps": [["In your project chat, ask for the lessons learned:", "From these end-of-project notes, write 3 lessons learned in a table with these columns: What happened, Why it happened, What we will do next time.\nUse only these notes.\n\n[paste the end-of-project notes]", null], ["Check each lesson against the notes. Delete anything the notes do not say.", null, null], ["In the same chat, ask for the closing email:", "Write the text of a short closing email to Maria (do not send it). Confirm what was delivered and the final cost, thank the team, and ask her to confirm she accepts the website. Under 150 words. Use only the facts in the notes.", null], ["If you have time, try these two extra prompts: 'Write a go-live checklist for a small bakery website.' and 'Write simple step-by-step instructions for Maria to change a price on the menu page.'", null, null]], "checked": "the lessons learned and the closing email as the AI wrote them", "checks": ["Every lesson comes from the end-of-project notes.", "Each lesson says what happened, why, and what we will do next time.", "The final cost in the email is $7,650.", "The email asks Maria to accept the website. It does not say she already has."], "save": "Toolkit page 7: lessons learned and the closing email.", "evalq": ["Did every lesson really come from the notes?", "Which lesson would help most on your next project?"]}], "final": ["Which project document will you use AI for first at work?", "Which question in the question guide caught the most problems today?", "Name one thing the AI got wrong that you might have missed before today.", "What will you never paste into a free AI tool?", "Finish these three rules: I will let AI draft ... I will always check ... I will never ..."], "skills": ["I can write a prompt with the recipe: Role, Task, Context, Format, Check.", "I can compare AI answers and explain which one is better.", "I can make a charter, scope, task list, schedule, budget, risk register and communication plan with AI help.", "I can turn meeting notes into an action list without fake promises.", "I can write a status report and a change request.", "I can build a project dashboard and check its numbers.", "I can close a project with lessons learned.", "I know what never to paste into a free AI tool."], "quiz": {"1": [["What is a project charter?", ["A detailed list of every task.", "A one-page agreement on why, what, when, how much and who decides.", "A contract with the web designer."], 1, "The charter is short. The task list comes later, in planning."], ["The AI's charter says 'increase bakery sales by 30%'. The project card and Maria's answers never say this. What do you do?", ["Keep it. It sounds good.", "Remove it, or mark it TO CONFIRM and ask Maria.", "Change it to 20% to be safe."], 1, "A number that is not on the card was made up. Only the sponsor can set a goal like this."], ["Who signs the project charter?", ["The AI", "The project manager alone", "Maria, the sponsor"], 2, "The sponsor pays and decides, so the sponsor approves the charter."]], "2": [["Why do we write an 'out of scope' list?", ["To protect the project from extra requests.", "To make the document longer.", "Because Excel needs it."], 0, "When someone asks for 'one more thing', the out-of-scope list shows it was never part of the deal."], ["The AI gives Sam 2 days to build all 5 pages. Which question in the guide catches this?", ["Is it safe to share?", "Is it realistic?", "Is it clear for the reader?"], 1, "AI often guesses durations. Real work takes longer, and the project manager knows that."], ["What is a milestone?", ["A task with a lot of work.", "A checkpoint, such as 'design approved'.", "The budget limit."], 1, "A milestone has no work of its own. It marks that something important is finished."]], "3": [["What is a contingency?", ["Spare money for surprises.", "The designer's fee.", "Money already spent."], 0, "We keep about 10% aside, because something always costs more than planned."], ["A risk has likelihood 3 and impact 2. What is its score?", ["5", "6", "1"], 1, "Score = likelihood times impact: 3 x 2 = 6."], ["Two risks both score 6. Who decides which one matters more?", ["The AI", "Excel", "You, the project manager"], 2, "Scores help, but choosing between equal scores is your judgment."]], "4": [["Jo said she 'might' take the photos this week. In the action list, did Jo agree?", ["Yes", "No. 'Might' is not a promise.", "Only if the AI says so."], 1, "Write 'No' and follow up with Jo. A maybe on the list as a promise causes trouble later."], ["Nobody took the menu-prices task. What should the action list say?", ["Maria", "NO OWNER, and ask who will take it.", "Leave the task out."], 1, "A task with no owner usually does not get done. Flag it so someone takes it."], ["Maria asks for an allergy question on the cake form. What is this?", ["Inside the scope: add it as a task.", "A big change that needs a change request.", "Not allowed."], 0, "The cake form is already in scope. A small addition to it becomes a new task."], ["In round 1, with no rules, the AI wrote 'Jo - take the photos - Friday'. The notes never say Friday. Where did Friday come from?", ["Jo said it in the meeting.", "The AI made it up to fill the empty cell.", "Friday is the normal deadline."], 1, "With no rule, the AI fills every empty cell with a guess. 'Do not invent owners or dates' is the control that stops it."]], "5": [["The design is one week late, but the buffer week can still save the deadline. What is the status?", ["Green", "Yellow", "Red"], 1, "Yellow means something is late or at risk, but we can still make the deadline."], ["Who decides whether to add online payment?", ["Maria, the sponsor", "The AI", "Sam, the designer"], 0, "Changes to scope, time or money are decided by the sponsor, using the change request."], ["The change costs $1,200. The contingency is $800. What is true?", ["The contingency covers it.", "It is not enough: Maria must find $400 more or choose another option.", "It does not matter."], 1, "$1,200 - $800 = $400 short. Always do this arithmetic yourself."], ["Round 1 called the project Green. Round 2, with the colour rules, called it Yellow. Why?", ["The AI changed its mind at random.", "The rules say Yellow means 'late or at risk, but we can still meet the deadline'.", "Green and Yellow mean the same thing."], 1, "Without a definition, 'on track' sounds right because the launch date has not moved. The rules make the AI use your definition."]], "6": [["The AI dashboard says 55% of the budget is used. Excel says 61%. Which do you trust?", ["The AI", "Excel, and then fix the dashboard.", "The average of the two."], 1, "Excel calculates from your own numbers. The AI often counts or divides wrongly."], ["Who is a project dashboard for?", ["The sponsor, to see the project's health in one minute.", "The designer, to see the code.", "Nobody; it is only for the project manager."], 0, "A dashboard is short on purpose: colour, progress, money, risks and decisions."]], "7": [["Which is a good lesson learned?", ["'Communicate more.'", "'Photos were late because Jo had no time. Next time, book a photo session outside opening hours.'", "'Everything went well.'"], 1, "A good lesson says what happened, why, and what we will do next time."], ["What should the closing email do?", ["Say that Maria has approved the website.", "Ask Maria to confirm she accepts the website.", "Ask Maria for a bonus."], 1, "The project is not closed until the sponsor says yes."]]}, "demo": [["Let the AI interview you", "Most people only ask AI questions. It can also ask the questions, like an experienced project manager would.", "I am the project manager for a new 5-page website for a small bakery. Before you plan anything, interview me. Ask me the 5 questions a good project manager would ask first. Ask one question at a time and wait for my answer.", "Answer from the bakery card. Point out the questions a beginner forgets: who approves, what is out of scope, which deadline cannot move."], ["From idea to plan in three prompts", "One chat can build a whole plan. Each answer becomes the input for the next.", "Using my answers, write a one-page project charter.\nNow break the work into 15 tasks in a table: Task, Owner, Days, Depends on.\nNow turn the tasks into a week-by-week timeline for 9 weeks, with an X in each week a task runs.", "Three documents in about three minutes. Find one number or goal in the charter that you never gave it."], ["The pre-mortem", "Imagine the project already failed, then work out why. AI writes this in seconds.", "Imagine it is week 10 and the bakery website launch failed. Write the short story of what went wrong. Then turn the story into a risk table: Risk, Likelihood (1 to 3), Impact (1 to 3), What we do now to prevent it.", "The risks are realistic for a small business: late photos, slow approvals, extra features. Ask the room which one they have lived through."], ["Rehearse with your sponsor", "AI can play a stakeholder, so you can practise a hard conversation before the real one.", "Play Maria, the bakery owner. You are busy and you care about cost. I will tell you the website is one week late. React the way Maria would, and ask me two tough questions. Stay in character until I say stop.", "Answer one question live. Then ask it to be tougher. This is practice for the status meeting."], ["One prompt, one dashboard", "AI can pull a whole project into one page for the boss.", "Turn everything in this chat into a one-page project dashboard for Maria: status colour, progress, next milestones, top 3 risks and decisions needed. Use a table.", "Then the twist. Ask: Which facts or numbers in this dashboard did I never give you? Read the answer out loud."]], "demo_try": "Your turn (5 minutes): open a new chat, paste the bakery project card, and run the pre-mortem or the interview prompt. Write down one thing the AI raised that you had not thought of.", "inputs": {"1": [["Maria's answers", "Maria's answers to the project manager's questions.\n- Success means: the website is live by the end of week 9, it costs no more than $8,000, and the first online cake request comes in during the first month.\n- The $8,000 must cover everything: Sam's work, hosting and the web address for one year, and a 10% contingency ($800).\n- Not in this project: online payment, delivery, a loyalty programme, social media.\n- The website must work well on phones. Most customers will look at it on their phone.\n- I want short instructions so I can change the menu prices myself.\n- I will sign the charter in week 2.\n- Anything else: I do not know yet. Write TO CONFIRM and ask me on Monday."]], "2": [["Schedule template", "# SCHEDULE TEMPLATE: Maple Street Bakery website\n# Fill in this table from our task list. Reply with only the filled-in table.\n# Keep the four columns and their names exactly as they are.\n# Write one row for every task in our task list, in the same order, with the same ID and the same task name.\n# Then write the five milestone rows exactly as they are below. Fill in the weeks only.\n# Weeks are numbers from 1 to 9, like 3 (not \"Week 3\"). A milestone starts and ends in the same week.\n# A task where Maria reviews or approves something starts the week after the work it reviews ends (she reviews only on Mondays).\n# Building starts after the design is approved.\n# Week 8 is the buffer week: plan no task in week 8 at all. Finish testing by week 7. Only the final approval and the launch go in week 9.\n# Do not write a row for the buffer.\n# Write no other rows: no buffer row, no notes, no totals.\n| ID | Task or milestone | Start week | End week |\n|---|---|---|---|\n| T1 | <task T1, as in the task list> | <week> | <week> |\n| T2 | <task T2, as in the task list> | <week> | <week> |\n| ... | <one row for every task in the task list> | <week> | <week> |\n| M1 | Milestone: Plan approved | <week> | <same week> |\n| M2 | Milestone: Design approved | <week> | <same week> |\n| M3 | Milestone: Content ready | <week> | <same week> |\n| M4 | Milestone: Site tested | <week> | <same week> |\n| M5 | Milestone: Launch | 9 | 9 |"]], "4": [["Meeting notes", "Website meeting, week 3, Monday.\n- Sam showed two homepage designs. Maria likes design B but wants a bigger photo of the cakes.\n- Sam will send the updated design by Thursday.\n- Jo said she might be able to take the cake photos this week if the shop is quiet.\n- Nobody has the final menu prices yet. Maria said \"someone should get those from the kitchen\".\n- Maria wants the cake order form to ask about allergies.\n- Next meeting: next Monday."]], "5": [["Week 6 update", "Week 6 updates.\n- The plan was approved in week 2, on time. All the Plan tasks are finished.\n- The design was approved in week 5. The plan said week 4, so it is one week late.\n- Sam set up the hosting and the web address in week 5.\n- The menu text and the About text are done.\n- The cake photos are not taken yet. Jo was sick for 3 days.\n- Sam has built 3 of the 5 pages.\n- Money spent so far: $4,900 of $8,000.\n- Next week: Sam builds the last 2 pages and the cake form. Jo will take the cake photos on Saturday morning, before the shop opens.\n- On Monday Maria asked: \"Can customers pay for cakes online too?\"\n- The launch is still planned for the end of week 9."], ["Colour rules", "Green: on schedule and on budget.\nYellow: something is late or at risk, but we can still meet the deadline and budget.\nRed: we will miss the deadline or the budget unless someone makes a decision."], ["Payment facts", "Sam estimates that online payment adds about $1,200 and 2 weeks of work.\nThe total budget is $8,000 and $4,900 is spent. The 10% contingency is $800.\nThe launch is planned for the end of week 9."]], "6": [["Dashboard template", "# PROJECT DASHBOARD TEMPLATE\n# Fill in every line from our project. Keep each label and its colon, and keep the | marks between parts.\n# Write numbers only: no $ signs, no commas, no % signs. Write one TASK, MILESTONE, RISK, ACTION or OPTION line per item.\nPROJECT: <project name>\nSPONSOR: <the sponsor's name or role>\nWEEK: <this week> | <total weeks in the plan>\nSTATUS: <Green, Yellow or Red> | <one sentence: why>\nBUDGET: <approved budget> | <spent so far> | <contingency>\nAI COUNTS: <how many tasks are Done> | <how many tasks in total> | <percent of the budget used>\nTASK: <ID> | <task> | <owner> | <start week> | <end week> | <Done, In progress or Not started>\nMILESTONE: <milestone> | <planned week> | <actual or forecast week> | <Done, On track, At risk or Late>\nRISK: <ID> | <risk> | <likelihood 1 to 3> | <impact 1 to 3> | <response> | <owner>\nACTION: <open action> | <owner> | <due>\nDECISION: <what the sponsor must decide>\nOPTION: <the option, in a few words> | <extra cost on top of the plan> | <launch week> | <Recommended, or leave empty>"]], "7": [["End-of-project notes", "End-of-project notes.\n- The website went live at the end of week 9, on time.\n- Final cost: $7,650. Online payment was moved to a later phase.\n- The cake photos were late because Jo had no time in the shop. We fixed it with a photo session on Saturday morning before opening.\n- Maria's Monday-only reviews made the design approval one week late.\n- The first online cake request came in on day 3."]]}, "template_files": {"Schedule template": "11_AI_Template_Schedule.txt", "Dashboard template": "11_AI_Template_Dashboard.txt"}, "hunt": "Write down every problem you found in the AI's answers. Then reveal the checks. For each check, look at your own AI answer and mark what it did. The AI gives a different answer every time, so yours may get some checks right. That is fine: you only count the mistakes your AI really made.", "verdicts": [["right", "AI got it right", "The AI's answer already does this."], ["found", "Wrong: I found it", "The AI got this wrong, and it was on my own list."], ["missed", "Wrong: I missed it", "The AI got this wrong, and I did not see it until now."]], "habits": ["Lab 1: open a new chat for each of Prompts A, B and C, so the answers do not mix.", "From then on, keep one project chat: the Prompt C chat. You paste the project card once, and the chat remembers it.", "Tell the AI what to do when it does not know: 'write TO CONFIRM' or 'ask me'."], "edit_note": "You can edit this prompt, or write it in your own words.", "as_is_note": "Use this prompt exactly as written, so the comparison is fair.", "events": [{"num": 1, "title": "Sam is sick", "who": "Text message from Sam, Monday of week 7", "news": "Bad news. I have the flu and the doctor says a week of rest. I can't work at all this week. So sorry!", "text": "Event card 1: Sam is sick. Text message from Sam, Monday of week 7: \"Bad news. I have the flu and the doctor says a week of rest. I can't work at all this week. So sorry!\""}, {"num": 2, "title": "Maria wants Instagram", "who": "Text message from Maria, Monday of week 7", "news": "I saw the Rosewood Café website. It shows their Instagram photos on the homepage. Can we have that too? It looks so nice!", "text": "Event card 2: Maria wants Instagram. Text message from Maria, Monday of week 7: \"I saw the Rosewood Café website. It shows their Instagram photos on the homepage. Can we have that too? It looks so nice!\""}, {"num": 3, "title": "The photos do not work", "who": "Message from Jo, Saturday of week 7", "news": "I took the cake photos this morning, but the shop was too dark. Sam says only 4 of the 20 photos are good enough to use.", "text": "Event card 3: The photos do not work. Message from Jo, Saturday of week 7: \"I took the cake photos this morning, but the shop was too dark. Sam says only 4 of the 20 photos are good enough to use.\""}, {"num": 4, "title": "The newspaper calls", "who": "Phone call from Maria, Monday of week 7", "news": "The Daily Herald wants to write about our new website! But their story comes out at the end of week 8. Can we launch a week early?", "text": "Event card 4: The newspaper calls. Phone call from Maria, Monday of week 7: \"The Daily Herald wants to write about our new website! But their story comes out at the end of week 8. Can we launch a week early?\""}, {"num": 5, "title": "Sam's extra invoice", "who": "Email from Sam, Tuesday of week 7", "news": "The pages took longer than I quoted. I need to charge $900 more for the build. Can you approve this?", "text": "Event card 5: Sam's extra invoice. Email from Sam, Tuesday of week 7: \"The pages took longer than I quoted. I need to charge $900 more for the build. Can you approve this?\""}, {"num": 6, "title": "The cake requests are lost", "who": "Message from Jo, Wednesday of week 7", "news": "I sent a test cake request from my phone. It never arrived in the shop inbox. Sam found that it went to his own email.", "text": "Event card 6: The cake requests are lost. Message from Jo, Wednesday of week 7: \"I sent a test cake request from my phone. It never arrived in the shop inbox. Sam found that it went to his own email.\""}], "event_intro": "Something just happened to your project. Your instructor gives your team one card. You have 10 minutes. Then some teams read their message to Maria out loud.", "event_kinds": [["Risk", "It might happen. Nothing has gone wrong yet."], ["Issue", "It has already happened. You need to deal with it now."], ["Change request", "Someone wants to change the scope, the time or the money. Maria decides."], ["Opportunity", "Good news that still needs a decision, and may carry risk."]], "event_steps": ["Read the card as a team. Decide what kind of problem it is: a risk, an issue, a change request or an opportunity.", "Run prompt 1 in your project chat. Check every number in the options against the week 6 update and your Excel.", "Update the risk register in Excel (sheet 5 Risks): add a new row, or change a score.", "Run prompt 2. Fix the message so it is true and short.", "Be ready to read your message to Maria out loud. It should take 30 seconds."], "event_prompts": ["Something new just happened:\n[paste the event card]\nIs this a risk, an issue, a change request or an opportunity? Say why in one sentence.\nThen give me 3 options. For each option, show the impact on cost, schedule and risk.\nUse only the numbers in this chat. If a number is missing, write TO CONFIRM. Do not choose for Maria.", "Write a message to Maria, under 80 words. Say what happened, what it means for the launch date and the budget, which option I recommend and why, and what I need from her. If she does not need to decide anything, say so."], "dash_page": "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Project Dashboard<\/title>\n<\!--\n  THE PROJECT DASHBOARD PAGE (plain English)\n  - It reads a filled-in dashboard template: plain text, one line per item, parts split by \"|\".\n    Any AI chat can fill the template (ChatGPT, Copilot, Claude, Gemini); the AI never writes code.\n  - From that text the page draws the dashboard and does the counting and dividing itself.\n  - It also checks the AI's own numbers (\"AI COUNTS\" line) against the lines it wrote, and lists any problem.\n  - MODE \"builder\": a paste box at the top (10_Project_Dashboard_TEMPLATE.html).\n    MODE \"view\": just the dashboard (10_Project_Dashboard_EXAMPLE.html, and downloads).\n    MODE \"embed\": inside the web lab (no paste box; it tells the web lab its height).\n  - No internet needed. Nothing is sent anywhere.\n-->\n<style>\n:root{\n  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;\n  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --accent:#c8102e;\n  --good:#0ca30c; --warning:#fab219; --critical:#d03b3b;\n  --t-not:#86b6ef; --t-prog:#2a78d6; --t-done:#184f95;       /* task status: ordinal blue ramp */\n  --r1:#f09a74; --r2:#d95926; --r3:#a03c16;                  /* risk score: ordinal orange ramp */\n  --wash:rgba(42,120,214,.09);\n  color-scheme:light;\n}\n@media (prefers-color-scheme: dark){ :root:where(:not([data-theme=\"light\"])){\n  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;\n  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#ff4d63;\n  --t-not:#184f95; --t-prog:#2a78d6; --t-done:#86b6ef;\n  --r1:#8a3a18; --r2:#d95926; --r3:#f4a988;\n  --wash:rgba(57,135,229,.14);\n  color-scheme:dark; } }\n:root[data-theme=\"dark\"]{\n  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;\n  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --accent:#ff4d63;\n  --t-not:#184f95; --t-prog:#2a78d6; --t-done:#86b6ef;\n  --r1:#8a3a18; --r2:#d95926; --r3:#f4a988;\n  --wash:rgba(57,135,229,.14);\n  color-scheme:dark; }\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--page);color:var(--ink);font:15px/1.5 system-ui,-apple-system,\"Segoe UI\",sans-serif}\nbody.embed{background:transparent}\nbutton,textarea{font:inherit;color:inherit}\nbutton{cursor:pointer}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 40px}\nbody.embed .wrap{padding:4px 0 8px}\n.card{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:16px 18px;margin:0 0 14px}\nh1{font-size:26px;line-height:1.2;margin:2px 0 0}\nh2{font-size:16px;margin:0 0 10px}\n.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}\n.muted{color:var(--muted)} .ink2{color:var(--ink2)}\n.small{font-size:13px}\n.num{font-variant-numeric:tabular-nums}\n.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}\n.tools{display:flex;gap:8px;flex-wrap:wrap}\n.btn{background:var(--ink);color:var(--surface);border:0;border-radius:6px;padding:7px 13px;font-size:14px;font-weight:600}\n.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--axis);font-weight:500}\n.btn[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}\n/* status banner: colour + icon + label, never colour alone */\n.status{display:flex;gap:14px;align-items:center;border-left:6px solid var(--st);padding:14px 18px}\n.badge{display:inline-flex;align-items:center;gap:6px;background:var(--st);color:var(--st-ink);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}\n.status p{margin:0}\n.st-good{--st:var(--good);--st-ink:#0b0b0b} .st-warning{--st:var(--warning);--st-ink:#0b0b0b} .st-critical{--st:var(--critical);--st-ink:#ffffff} .st-none{--st:var(--axis);--st-ink:var(--ink)}\n/* problems found in the AI's data */\n.warn{border:1px solid var(--critical);border-left:6px solid var(--critical)}\n.warn h2{color:var(--critical)}\n.warn ul{margin:0;padding-left:20px}\n/* stat tiles */\n.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:14px}\n.tile{margin:0}\n.tile .label{font-size:13px;color:var(--ink2)}\n.tile .big{font-size:30px;font-weight:700;line-height:1.15;margin:2px 0}\n.meter{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin:8px 0 6px}\n.meter i{display:block;height:100%;background:var(--t-prog);border-radius:4px}\n.math{display:none;font-size:13px;color:var(--ink2);border-top:1px dashed var(--axis);margin-top:8px;padding-top:6px}\nbody.show-math .math{display:block}\n/* filter row */\n.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 14px}\n.chip{border:1px solid var(--axis);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}\n.chip[aria-pressed=\"true\"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}\n/* timeline */\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:0 0 10px}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.sw{width:18px;height:10px;border-radius:3px;display:inline-block}\n.dia{width:10px;height:10px;transform:rotate(45deg);display:inline-block;border:2px solid var(--ink);background:var(--surface)}\n.dia.fill{background:var(--ink)}\n.dia.late{background:var(--warning);border-color:var(--warning)}\n.gantt{display:grid;column-gap:2px;row-gap:4px;align-items:center;overflow-x:auto}\n.gh{font-size:12px;color:var(--muted);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--axis)}\n.gh.now{color:var(--ink);font-weight:700}\n.glabel{font-size:13px;padding-right:10px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.glabel b{font-weight:600}\n.gcell{height:22px;position:relative}\n.gnow{background:var(--wash)}\n.bar{height:14px;border-radius:4px;align-self:center;position:relative;z-index:1}\n.bar.Done{background:var(--t-done)} .bar.InProgress{background:var(--t-prog)} .bar.NotStarted{background:var(--t-not)} .bar.Unknown{background:var(--axis)}\n.mrow{display:flex;align-items:center;justify-content:center;height:22px}\n.gsep{grid-column:1 / -1;border-top:1px solid var(--grid);margin:4px 0 2px;font-size:12px;color:var(--muted);padding-top:4px}\n[data-tip]{cursor:default}\n.tip{position:fixed;z-index:9;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;line-height:1.4;padding:7px 10px;border-radius:6px;max-width:300px;display:none}\ntable{border-collapse:collapse;width:100%;font-size:14px}\nth{text-align:left;font-weight:600;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--axis);padding:6px 8px}\ntd{border-bottom:1px solid var(--grid);padding:6px 8px;vertical-align:top}\n/* risks and actions */\n.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media (max-width:820px){ .two{grid-template-columns:1fr} }\n.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:2px;align-items:stretch}\n.mx-axis{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:2px 6px}\n.mx-cell{min-height:64px;border-radius:4px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}\n.mx-cell.low{background:var(--r1)} .mx-cell.med{background:var(--r2)} .mx-cell.high{background:var(--r3)}\n.rchip{background:var(--surface);color:var(--ink);border:1px solid var(--ring);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600}\n.rchip[aria-pressed=\"true\"]{outline:2px solid var(--ink);outline-offset:1px}\n.rchip.dim{opacity:.35}\n.rdetail{margin-top:12px;border-top:1px solid var(--grid);padding-top:10px}\n/* decision */\n.opts{display:flex;flex-direction:column;gap:6px;margin:10px 0}\n.opt{text-align:left;border:1px solid var(--axis);background:var(--surface);border-radius:8px;padding:9px 12px}\n.opt[aria-pressed=\"true\"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}\n.rec{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ink2);border-radius:999px;padding:0 8px;margin-left:6px}\n.impact{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}\n.impact div{border:1px solid var(--grid);border-radius:8px;padding:8px 10px}\n.impact b{display:block;font-size:20px}\n.short{color:var(--critical)}\n/* builder */\n.builder textarea{width:100%;min-height:150px;border:1px solid var(--axis);border-radius:6px;padding:10px;background:var(--page);font:13px/1.5 ui-monospace,Consolas,monospace}\n.builder ol{margin:0 0 10px;padding-left:20px}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}\n.empty{padding:28px 18px;text-align:center;color:var(--ink2)}\ndetails pre{white-space:pre-wrap;font:12.5px/1.5 ui-monospace,Consolas,monospace;background:var(--page);border:1px solid var(--grid);border-radius:6px;padding:10px;max-height:320px;overflow:auto}\n.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:14px;z-index:10}\n@media print{ .tools,.builder,.filters button.chip:not([aria-pressed=\"true\"]){display:none} body{background:#fff} }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <section class=\"card builder\" id=\"builder\" hidden><\/section>\n  <div id=\"app\"><\/div>\n<\/div>\n<div class=\"tip\" id=\"tip\" role=\"tooltip\"><\/div>\n<script>\n/* Filled in when the file is built (see dashboard.py). Each is a plain string. */\nconst RAW = /*DATA_START*/\"\"/*DATA_END*/;\nconst MODE = /*MODE_START*/\"embed\"/*MODE_END*/;\nconst PROMPT = /*PROMPT_START*/\"Fill in this project dashboard template for week 6, using everything in this chat.\\nWhere I fixed your drafts, use my versions below.\\nRules: Keep the format exactly. Write one line for every task, milestone, risk, open action and option. Use only facts from this chat and my fixes. If you are not sure about a part, write (?) there. Reply with only the filled-in template, in one code block.\\n\\n# PROJECT DASHBOARD TEMPLATE\\n# Fill in every line from our project. Keep each label and its colon, and keep the | marks between parts.\\n# Write numbers only: no $ signs, no commas, no % signs. Write one TASK, MILESTONE, RISK, ACTION or OPTION line per item.\\nPROJECT: \\u003cproject name>\\nSPONSOR: \\u003cthe sponsor's name or role>\\nWEEK: \\u003cthis week> | \\u003ctotal weeks in the plan>\\nSTATUS: \\u003cGreen, Yellow or Red> | \\u003cone sentence: why>\\nBUDGET: \\u003capproved budget> | \\u003cspent so far> | \\u003ccontingency>\\nAI COUNTS: \\u003chow many tasks are Done> | \\u003chow many tasks in total> | \\u003cpercent of the budget used>\\nTASK: \\u003cID> | \\u003ctask> | \\u003cowner> | \\u003cstart week> | \\u003cend week> | \\u003cDone, In progress or Not started>\\nMILESTONE: \\u003cmilestone> | \\u003cplanned week> | \\u003cactual or forecast week> | \\u003cDone, On track, At risk or Late>\\nRISK: \\u003cID> | \\u003crisk> | \\u003clikelihood 1 to 3> | \\u003cimpact 1 to 3> | \\u003cresponse> | \\u003cowner>\\nACTION: \\u003copen action> | \\u003cowner> | \\u003cdue>\\nDECISION: \\u003cwhat the sponsor must decide>\\nOPTION: \\u003cthe option, in a few words> | \\u003cextra cost on top of the plan> | \\u003claunch week> | \\u003cRecommended, or leave empty>\\n\\nWhat I fixed:\\n[paste what you fixed]\"/*PROMPT_END*/;\nconst EXAMPLE = /*EXAMPLE_START*/\"\"/*EXAMPLE_END*/;\nconst SAVE_KEY = \"project-dashboard-builder\";\n\nconst esc = s => String(s == null ? \"\" : s).replace(/[&<>\"']/g, c => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst money = v => v == null ? \"?\" : \"$\" + Math.round(v).toLocaleString(\"en-US\");\nconst pct = (a, b) => (b ? Math.round(a / b * 100) : 0);\nfunction num(s){\n  if (s == null) return null;\n  const t = String(s).replace(/[$,%\\s]/g, \"\").replace(/^(weeks?|wk|w)/i, \"\");\n  if (t === \"\") return null;\n  const v = Number(t);\n  return isFinite(v) ? v : null;\n}\nfunction colour(s){\n  const t = String(s || \"\").trim().toLowerCase();\n  if (t.startsWith(\"green\")) return \"Green\";\n  if (t.startsWith(\"yellow\") || t.startsWith(\"amber\")) return \"Yellow\";\n  if (t.startsWith(\"red\")) return \"Red\";\n  return null;\n}\nfunction taskStatus(s){\n  const t = String(s || \"\").trim().toLowerCase();\n  if (/^(done|complete|completed|finished)/.test(t)) return \"Done\";\n  if (/^(in progress|in-progress|started|ongoing|underway|doing)/.test(t)) return \"In progress\";\n  if (/^(not started|not yet|to do|todo|planned|pending)/.test(t)) return \"Not started\";\n  return null;\n}\nfunction msStatus(s){\n  const t = String(s || \"\").trim().toLowerCase();\n  if (/^(done|complete|completed|met|achieved)/.test(t)) return \"Done\";\n  if (/^(on track|on-track|ok)/.test(t)) return \"On track\";\n  if (/^(at risk|at-risk|risk)/.test(t)) return \"At risk\";\n  if (/^(late|delayed|missed|behind)/.test(t)) return \"Late\";\n  return null;\n}\n\n/* ---------- 1. Read the filled-in template ---------- */\nconst KEYS = [\"PROJECT\",\"SPONSOR\",\"WEEK\",\"STATUS\",\"BUDGET\",\"AI COUNTS\",\"TASK\",\"MILESTONE\",\"RISK\",\"ACTION\",\"DECISION\",\"OPTION\"];\nconst KEY_RE = new RegExp(\"^(\" + KEYS.join(\"|\") + \")\\\\s*:\\\\s*(.*)$\", \"i\");\nfunction parse(raw){\n  const d = {project:\"\", sponsor:\"\", week:null, weeks:null, status:null, statusText:\"\", reason:\"\", budget:null, spent:null,\n             contingency:null, ai:null, tasks:[], milestones:[], risks:[], actions:[], decision:\"\", options:[], skipped:[], placeholders:0};\n  String(raw || \"\").replace(/\\r/g, \"\").split(\"\\n\").forEach(line => {\n    let t = line.trim();\n    if (!t || t.startsWith(\"#\") || t.startsWith(\"```\")) return;\n    t = t.replace(/^[-*•]\\s+/, \"\").replace(/^\\d+[.)]\\s+/, \"\").replace(/\\*\\*/g, \"\").replace(/`/g, \"\").trim();\n    const m = t.match(KEY_RE);\n    if (!m) { d.skipped.push(t); return; }\n    const key = m[1].toUpperCase(), rest = m[2].trim();\n    if (/<[^>]{2,}>/.test(rest)) { d.placeholders++; return; }\n    const p = rest.replace(/^\\|/, \"\").replace(/\\|$/, \"\").split(\"|\").map(s => s.trim());\n    if (key === \"PROJECT\") d.project = rest;\n    else if (key === \"SPONSOR\") d.sponsor = rest;\n    else if (key === \"WEEK\") { d.week = num(p[0]); d.weeks = num(p[1]); }\n    else if (key === \"STATUS\") { d.statusText = p[0]; d.status = colour(p[0]); d.reason = p.slice(1).join(\" | \"); }\n    else if (key === \"BUDGET\") { d.budget = num(p[0]); d.spent = num(p[1]); d.contingency = num(p[2]); }\n    else if (key === \"AI COUNTS\") d.ai = {done: num(p[0]), total: num(p[1]), pct: num(p[2])};\n    else if (key === \"TASK\") d.tasks.push({id:p[0] || \"\", name:p[1] || \"\", owner:p[2] || \"\", start:num(p[3]), end:num(p[4]), statusText:p[5] || \"\", status:taskStatus(p[5])});\n    else if (key === \"MILESTONE\") d.milestones.push({name:p[0] || \"\", planned:num(p[1]), actual:num(p[2]), statusText:p[3] || \"\", status:msStatus(p[3])});\n    else if (key === \"RISK\") d.risks.push({id:p[0] || \"\", name:p[1] || \"\", l:num(p[2]), i:num(p[3]), response:p[4] || \"\", owner:p[5] || \"\"});\n    else if (key === \"ACTION\") d.actions.push({name:p[0] || \"\", owner:p[1] || \"\", due:p[2] || \"\"});\n    else if (key === \"DECISION\") d.decision = rest;\n    else if (key === \"OPTION\") d.options.push({name:p[0] || \"\", cost:num(p[1]), week:num(p[2]), rec:/recommend/i.test(p[3] || \"\")});\n  });\n  return d;\n}\n\n/* ---------- 2. Check the AI's data: does it add up? ---------- */\nfunction problems(d){\n  const w = [], W = d.weeks || 0;\n  if (!d.tasks.length) w.push(\"There are no TASK lines. Paste the whole filled-in template.\");\n  if (d.placeholders) w.push(d.placeholders + \" line(s) still have a <placeholder> in them. The AI did not fill them in.\");\n  if (!d.week || !d.weeks) w.push(\"The WEEK line needs this week and the total weeks as numbers, like: WEEK: 6 | 9\");\n  if (!d.status) w.push(d.statusText ? 'The status \"' + d.statusText + '\" is not Green, Yellow or Red.' : \"There is no STATUS line.\");\n  if (d.budget == null || d.spent == null) w.push(\"The BUDGET line needs the approved budget and the money spent, as numbers.\");\n  else if (d.spent > d.budget) w.push(\"Spent (\" + money(d.spent) + \") is more than the budget (\" + money(d.budget) + \").\");\n  const done = d.tasks.filter(t => t.status === \"Done\").length;\n  if (d.ai) {\n    if (d.ai.done != null && d.ai.done !== done) w.push(\"The AI says \" + d.ai.done + \" tasks are done, but \" + done + \" TASK lines say Done.\");\n    if (d.ai.total != null && d.ai.total !== d.tasks.length) w.push(\"The AI says there are \" + d.ai.total + \" tasks, but it wrote \" + d.tasks.length + \" TASK lines.\");\n    if (d.ai.pct != null && d.budget && d.spent != null && Math.abs(pct(d.spent, d.budget) - d.ai.pct) > 1)\n      w.push(\"The AI says \" + d.ai.pct + \"% of the budget is used, but \" + money(d.spent) + \" of \" + money(d.budget) + \" is \" + pct(d.spent, d.budget) + \"%.\");\n  } else w.push(\"There is no AI COUNTS line, so the AI's own counts cannot be checked.\");\n  d.tasks.forEach(t => {\n    if (t.start == null || t.end == null) w.push((t.id || t.name) + \": the start and end weeks must be numbers.\");\n    else if (t.start > t.end) w.push((t.id || t.name) + \": the start week is after the end week.\");\n    else if (W && (t.start < 1 || t.end > W)) w.push((t.id || t.name) + \": weeks \" + t.start + \" to \" + t.end + \" are outside weeks 1 to \" + W + \".\");\n    if (!t.status) w.push((t.id || t.name) + ': the status \"' + t.statusText + '\" should be Done, In progress or Not started.');\n  });\n  d.risks.forEach(r => { if (!(r.l >= 1 && r.l <= 3 && r.i >= 1 && r.i <= 3)) w.push((r.id || r.name) + \": likelihood and impact must be numbers from 1 to 3.\"); });\n  d.milestones.forEach(m => { if (m.planned == null) w.push(m.name + \": the planned week must be a number.\"); });\n  d.options.forEach((o, i) => { if (!/[a-z]{3}/i.test(o.name)) w.push(\"Option \" + (i + 1) + ' is only \"' + o.name + '\". Ask the AI to write each option in a few words.'); });\n  if (d.decision && !d.options.length) w.push(\"There is a DECISION but no OPTION lines.\");\n  return w;\n}\n\n/* ---------- 3. Draw the dashboard ---------- */\nlet D = null, OWNER = \"All\", RISK = null, OPTION = null, TABLE = false;\nconst STATUS_CLASS = {Green:\"st-good\", Yellow:\"st-warning\", Red:\"st-critical\"};\nconst STATUS_ICON = {Green:\"✓\", Yellow:\"!\", Red:\"✕\"};\nconst TASK_GLYPH = {\"Done\":\"✓\", \"In progress\":\"◐\", \"Not started\":\"○\"};\nconst band = s => s >= 6 ? \"high\" : s >= 3 ? \"med\" : \"low\";\nconst BAND_NAME = {low:\"Low (1 to 2)\", med:\"Medium (3 to 4)\", high:\"High (6 to 9)\"};\n\nfunction owners(d){\n  const seen = [];\n  d.tasks.concat(d.actions).forEach(x => { const o = (x.owner || \"\").trim(); if (o && !seen.includes(o)) seen.push(o); });\n  return seen;\n}\nconst shown = x => OWNER === \"All\" || (x.owner || \"\").trim() === OWNER;\n\nfunction header(d){\n  const wk = d.week && d.weeks ? \"Week \" + d.week + \" of \" + d.weeks : \"Project dashboard\";\n  const tools = '<div class=\"tools\"><button class=\"btn ghost\" data-act=\"math\" aria-pressed=\"' + document.body.classList.contains(\"show-math\") + '\">Show the arithmetic<\/button>' +\n    (MODE !== \"embed\" ? '<button class=\"btn ghost\" data-act=\"print\">Print<\/button>' : \"\") + '<\/div>';\n  const st = d.status;\n  return '<div class=\"top\"><div><div class=\"eyebrow\">Project dashboard · ' + esc(wk) + '<\/div><h1>' + esc(d.project || \"Your project\") + '<\/h1>' +\n    (d.sponsor ? '<div class=\"muted small\">For ' + esc(d.sponsor) + '<\/div>' : \"\") + '<\/div>' + tools + '<\/div>' +\n    '<section class=\"card status ' + (STATUS_CLASS[st] || \"st-none\") + '\"><span class=\"badge\"><span aria-hidden=\"true\">' + (STATUS_ICON[st] || \"?\") + '<\/span>' + esc(st || \"No status\") + '<\/span>' +\n    '<p>' + esc(d.reason || \"\") + '<\/p><\/section>';\n}\nfunction warnings(list){\n  if (!list.length) return \"\";\n  return '<section class=\"card warn\" role=\"alert\"><h2>Check these before you show the dashboard<\/h2><ul>' + list.map(x => \"<li>\" + esc(x) + \"<\/li>\").join(\"\") +\n    '<\/ul><p class=\"small ink2\" style=\"margin:8px 0 0\">The dashboard counts and divides from the lines the AI wrote. Fix the lines, then build it again.<\/p><\/section>';\n}\nfunction tiles(d){
