\n  const done = d.tasks.filter(t => t.status === \"Done\").length, all = d.tasks.length;\n  const left = d.budget != null && d.spent != null ? d.budget - d.spent : null;\n  const used = d.budget && d.spent != null ? pct(d.spent, d.budget) : null;\n  const wk = d.week && d.weeks ? pct(d.week, d.weeks) : null;\n  const tile = (label, big, sub, fill, math) => '<div class=\"card tile\"><div class=\"label\">' + label + '<\/div><div class=\"big num\">' + big + '<\/div>' +\n    (fill != null ? '<div class=\"meter\" aria-hidden=\"true\"><i style=\"width:' + Math.max(0, Math.min(100, fill)) + '%\"><\/i><\/div>' : \"\") +\n    '<div class=\"small ink2\">' + sub + '<\/div><div class=\"math num\">' + math + '<\/div><\/div>';\n  return '<div class=\"tiles\">' +\n    tile(\"Tasks done\", done + \" of \" + all, pct(done, all) + \"% of the tasks\", pct(done, all), done + \" tasks say Done ÷ \" + all + \" tasks = \" + pct(done, all) + \"%\") +\n    tile(\"Budget used\", used == null ? \"?\" : used + \"%\", money(d.spent) + \" of \" + money(d.budget), used, money(d.spent) + \" ÷ \" + money(d.budget) + \" = \" + (used == null ? \"?\" : used + \"%\")) +\n    tile(\"Money left\", money(left), d.contingency != null ? \"Includes the \" + money(d.contingency) + \" contingency\" : \"\", null, money(d.budget) + \" − \" + money(d.spent) + \" = \" + money(left)) +\n    tile(\"Time\", d.week ? \"Week \" + d.week : \"?\", d.weeks ? (d.weeks - d.week) + \" weeks to the planned end (week \" + d.weeks + \")\" : \"\", wk, (d.week || \"?\") + \" ÷ \" + (d.weeks || \"?\") + \" weeks = \" + (wk == null ? \"?\" : wk + \"%\") + \" of the time\") +\n    '<\/div>';\n}\nfunction filters(d){\n  const list = [\"All\"].concat(owners(d));\n  return '<div class=\"filters\" role=\"group\" aria-label=\"Show work for\"><span class=\"small ink2\">Show work for:<\/span>' +\n    list.map(o => '<button class=\"chip\" data-owner=\"' + esc(o) + '\" aria-pressed=\"' + (OWNER === o) + '\">' + esc(o) + '<\/button>').join(\"\") + '<\/div>';\n}\nfunction timeline(d){\n  const W = Math.max(d.weeks || 0, ...d.tasks.map(t => t.end || 0), ...d.milestones.map(m => Math.max(m.planned || 0, m.actual || 0)), 1);\n  const tasks = d.tasks.filter(shown);\n  const legend = '<div class=\"legend\"><span><i class=\"sw\" style=\"background:var(--t-done)\"><\/i>✓ Done<\/span><span><i class=\"sw\" style=\"background:var(--t-prog)\"><\/i>◐ In progress<\/span>' +\n    '<span><i class=\"sw\" style=\"background:var(--t-not)\"><\/i>○ Not started<\/span><span><i class=\"dia\"><\/i>Milestone, planned<\/span><span><i class=\"dia fill\"><\/i>Done or forecast<\/span>' +\n    '<span><i class=\"dia late\"><\/i>Later than planned<\/span>' + (d.week ? '<span><i class=\"sw\" style=\"background:var(--wash);outline:1px solid var(--axis)\"><\/i>This week<\/span>' : \"\") + '<\/div>';\n  const head = '<h2>Timeline<\/h2>' + legend + '<div class=\"row\" style=\"margin:0 0 10px\"><button class=\"btn ghost\" data-act=\"table\" aria-pressed=\"' + TABLE + '\">' + (TABLE ? \"Show the timeline\" : \"Show as a table\") + '<\/button><\/div>';\n  if (TABLE) {\n    return '<section class=\"card\">' + head + '<table><tr><th>ID<\/th><th>Task or milestone<\/th><th>Owner<\/th><th>Weeks<\/th><th>Status<\/th><\/tr>' +\n      tasks.map(t => '<tr><td>' + esc(t.id) + '<\/td><td>' + esc(t.name) + '<\/td><td>' + esc(t.owner) + '<\/td><td class=\"num\">' + esc(t.start) + (t.end !== t.start ? \" to \" + esc(t.end) : \"\") + '<\/td><td>' + esc(t.status || t.statusText) + '<\/td><\/tr>').join(\"\") +\n      d.milestones.map(m => '<tr><td>◆<\/td><td>' + esc(m.name) + '<\/td><td><\/td><td class=\"num\">planned ' + esc(m.planned) + (m.actual != null ? \", now \" + esc(m.actual) : \"\") + '<\/td><td>' + esc(m.status || m.statusText) + '<\/td><\/tr>').join(\"\") +\n      '<\/table><\/section>';\n  }\n  const cols = \"minmax(200px,3.6fr) repeat(\" + W + \", minmax(24px,1fr))\";\n  let g = '<div class=\"gantt\" style=\"grid-template-columns:' + cols + '\"><div class=\"gh\" style=\"text-align:left\">Week<\/div>';\n  for (let w = 1; w <= W; w++) g += '<div class=\"gh' + (w === d.week ? \" now\" : \"\") + '\">' + w + (w === d.week ? \"<br>now\" : \"\") + '<\/div>';\n  let row = 2;\n  const nowCol = w => w === d.week;\n  tasks.forEach(t => {\n    const cls = ({\"Done\": \"Done\", \"In progress\": \"InProgress\", \"Not started\": \"NotStarted\"})[t.status] || \"Unknown\";\n    g += '<div class=\"glabel\" style=\"grid-row:' + row + '\" title=\"' + esc(t.name) + '\"><span aria-hidden=\"true\">' + (TASK_GLYPH[t.status] || \"?\") + '<\/span> <b>' + esc(t.id) + '<\/b> ' + esc(t.name) + ' <span class=\"muted\">· ' + esc(t.owner) + '<\/span><\/div>';\n    for (let w = 1; w <= W; w++) g += '<div class=\"gcell' + (nowCol(w) ? \" gnow\" : \"\") + '\" style=\"grid-row:' + row + ';grid-column:' + (w + 1) + '\"><\/div>';\n    if (t.start != null && t.end != null && t.start <= t.end) {\n      const tip = (t.id ? t.id + \" \" : \"\") + t.name + \"\\n\" + (t.owner || \"No owner\") + \" · week \" + t.start + (t.end !== t.start ? \" to \" + t.end : \"\") + \"\\n\" + (t.status || t.statusText || \"No status\");\n      g += '<div class=\"bar ' + cls + '\" tabindex=\"0\" data-tip=\"' + esc(tip) + '\" aria-label=\"' + esc(tip.replace(/\\n/g, \". \")) + '\" style=\"grid-row:' + row + ';grid-column:' + (Math.max(1, t.start) + 1) + ' / ' + (Math.min(W, t.end) + 2) + '\"><\/div>';\n    }\n    row++;\n  });\n  if (!tasks.length) { g += '<div class=\"glabel muted\" style=\"grid-row:' + row + '\">No tasks for ' + esc(OWNER) + '.<\/div>'; row++; }\n  if (d.milestones.length) {\n    g += '<div class=\"gsep\" style=\"grid-row:' + row + '\">Milestones<\/div>'; row++;\n    d.milestones.forEach(m => {\n      const late = m.actual != null && m.planned != null && m.actual > m.planned;\n      const diff = late ? \" (\" + (m.actual - m.planned) + \" week\" + (m.actual - m.planned > 1 ? \"s\" : \"\") + \" later than planned)\" : \"\";\n      g += '<div class=\"glabel\" style=\"grid-row:' + row + '\"><span aria-hidden=\"true\">◆<\/span> ' + esc(m.name) + ' <span class=\"muted\">· ' + esc(m.status || m.statusText) + esc(diff) + '<\/span><\/div>';\n      for (let w = 1; w <= W; w++) {\n        const isP = w === m.planned, isA = m.actual != null && w === m.actual;\n        let inner = \"\";\n        if (isP && isA) inner = '<i class=\"dia fill\"><\/i>';\n        else if (isP) inner = '<i class=\"dia\"><\/i>';\n        else if (isA) inner = '<i class=\"dia fill' + (late ? \" late\" : \"\") + '\"><\/i>';\n        const tip = inner ? m.name + \"\\nPlanned: week \" + m.planned + (m.actual != null ? \"\\nDone or forecast: week \" + m.actual : \"\") + \"\\n\" + (m.status || m.statusText) + diff : \"\";\n        g += '<div class=\"gcell mrow' + (nowCol(w) ? \" gnow\" : \"\") + '\" style=\"grid-row:' + row + ';grid-column:' + (w + 1) + '\"' + (inner ? ' tabindex=\"0\" data-tip=\"' + esc(tip) + '\" aria-label=\"' + esc(tip.replace(/\\n/g, \". \")) + '\"' : \"\") + '>' + inner + '<\/div>';\n      }\n      row++;\n    });\n  }\n  g += '<\/div>';\n  return '<section class=\"card\">' + head + g + '<\/section>';\n}\nfunction risks(d){\n  if (!d.risks.length) return '<section class=\"card\"><h2>Risks<\/h2><p class=\"muted\">No RISK lines.<\/p><\/section>';\n  const sorted = d.risks.slice().sort((a, b) => (b.l * b.i) - (a.l * a.i));\n  if (!RISK || !d.risks.some(r => r.id === RISK)) RISK = sorted[0].id;\n  let m = '<div class=\"matrix\" role=\"group\" aria-label=\"Risks by likelihood and impact\"><div><\/div>';\n  for (let L = 1; L <= 3; L++) m += '<div class=\"mx-axis\">Likelihood ' + L + '<\/div>';\n  for (let I = 3; I >= 1; I--) {\n    m += '<div class=\"mx-axis\">Impact ' + I + '<\/div>';\n    for (let L = 1; L <= 3; L++) {\n      const here = d.risks.filter(r => r.l === L && r.i === I);\n      m += '<div class=\"mx-cell ' + band(L * I) + '\">' + here.map(r => '<button class=\"rchip' + (shown(r) ? \"\" : \" dim\") + '\" data-risk=\"' + esc(r.id) + '\" aria-pressed=\"' + (r.id === RISK) + '\" aria-label=\"' + esc(r.id + \" \" + r.name + \", score \" + (r.l * r.i)) + '\">' + esc(r.id) + '<\/button>').join(\"\") + '<\/div>';\n    }\n  }\n  m += '<\/div>';\n  const legend = '<div class=\"legend\" style=\"margin-top:8px\">' + [\"low\", \"med\", \"high\"].map(b => '<span><i class=\"sw\" style=\"background:var(--r' + ({low:1, med:2, high:3})[b] + ')\"><\/i>' + BAND_NAME[b] + '<\/span>').join(\"\") + '<\/div>';\n  const r = d.risks.find(x => x.id === RISK);\n  const detail = r ? '<div class=\"rdetail\"><b>' + esc(r.id) + ' ' + esc(r.name) + '<\/b><div class=\"small ink2 num\">Likelihood ' + esc(r.l) + ' × impact ' + esc(r.i) + ' = score ' + (r.l * r.i) + ' (' + BAND_NAME[band(r.l * r.i)].split(\" \")[0].toLowerCase() + ')<\/div>' +\n    '<p style=\"margin:6px 0 0\"><b>Response:<\/b> ' + esc(r.response) + '<\/p><p class=\"small ink2\" style=\"margin:2px 0 0\">Owner: ' + esc(r.owner || \"none\") + '<\/p><\/div>' : \"\";\n  const top = '<p class=\"small ink2\" style=\"margin:10px 0 0\"><b>Highest scores:<\/b> ' + sorted.slice(0, 3).map(x => esc(x.id) + \" (\" + (x.l * x.i) + \")\").join(\", \") + '. When scores tie, you choose which matters most.<\/p>';\n  return '<section class=\"card\"><h2>Risks<\/h2><p class=\"small ink2\" style=\"margin:-4px 0 10px\">Click a risk to see its response.<\/p>' + m + legend + detail + top + '<\/section>';\n}\nfunction actions(d){\n  const list = d.actions.filter(shown);\n  return '<section class=\"card\"><h2>Open actions <span class=\"muted small\">(' + list.length + (OWNER !== \"All\" ? \" for \" + esc(OWNER) : \"\") + ')<\/span><\/h2>' +\n    (list.length ? '<table><tr><th>Action<\/th><th>Owner<\/th><th>Due<\/th><\/tr>' + list.map(a => '<tr><td>' + esc(a.name) + '<\/td><td>' + esc(a.owner) + '<\/td><td>' + esc(a.due) + '<\/td><\/tr>').join(\"\") + '<\/table>' : '<p class=\"muted\">No open actions' + (OWNER !== \"All\" ? \" for \" + esc(OWNER) : \"\") + '.<\/p>') + '<\/section>';\n}\nfunction decision(d){\n  if (!d.decision && !d.options.length) return \"\";\n  if (OPTION == null || OPTION >= d.options.length) { const r = d.options.findIndex(o => o.rec); OPTION = r >= 0 ? r : 0; }\n  const o = d.options[OPTION];\n  let impact = \"\";\n  if (o) {\n    const cost = o.cost || 0, cont = d.contingency;\n    const left = cont != null ? cont - cost : null;\n    const moneyLine = cost === 0 ? \"No extra cost\" : money(cost) + \" extra\";\n    const contLine = cont == null ? \"Contingency unknown\" : left >= 0 ? money(left) + \" of the contingency left\" : '<span class=\"short\">The contingency is ' + money(-left) + ' short<\/span>';\n    const weekLine = o.week == null ? \"Launch week unknown\" : !d.weeks ? \"Launch in week \" + o.week : o.week > d.weeks ? '<span class=\"short\">Launch in week ' + o.week + \", \" + (o.week - d.weeks) + \" week\" + (o.week - d.weeks > 1 ? \"s\" : \"\") + \" later than the plan<\/span>\" : \"Launch in week \" + o.week + \", as planned\";\n    impact = '<div class=\"impact\"><div><span class=\"small ink2\">Cost<\/span><b class=\"num\">' + moneyLine + '<\/b><\/div><div><span class=\"small ink2\">Contingency (' + money(cont) + ')<\/span><b class=\"num\">' + contLine + '<\/b><\/div><div><span class=\"small ink2\">Launch<\/span><b class=\"num\">' + weekLine + '<\/b><\/div><\/div>';\n  }\n  return '<section class=\"card\"><h2>Decision needed<\/h2><p style=\"margin:0\">' + esc(d.decision) + '<\/p>' +\n    '<p class=\"small ink2\" style=\"margin:4px 0 0\">Click an option to see what it means. ' + esc(d.sponsor ? d.sponsor + \" decides.\" : \"The sponsor decides.\") + '<\/p>' +\n    '<div class=\"opts\">' + d.options.map((x, i) => '<button class=\"opt\" data-option=\"' + i + '\" aria-pressed=\"' + (i === OPTION) + '\">' + (i + 1) + '. ' + esc(x.name) + (x.rec ? '<span class=\"rec\">Recommended<\/span>' : \"\") + '<\/button>').join(\"\") + '<\/div>' + impact + '<\/section>';\n}\nfunction dataBox(raw, d){\n  return '<details class=\"card\"><summary><b>The data behind this dashboard<\/b> <span class=\"muted small\">(what the AI filled in)<\/span><\/summary><pre>' + esc(raw.trim()) + '<\/pre>' +\n    (d.skipped.length ? '<p class=\"small ink2\">Lines the dashboard skipped (not part of the template): ' + d.skipped.map(esc).join(\" · \") + '<\/p>' : \"\") + '<\/details>' +\n    '<p class=\"small muted\">Drawn from the data above. Check every number against your Excel before you show it to the sponsor.<\/p>';\n}\n\nfunction draw(raw){\n  const app = document.getElementById(\"app\");\n  if (!String(raw || \"\").trim()) {\n    app.innerHTML = '<div class=\"card empty\"><b>No dashboard yet.<\/b><br>Paste the AI\\'s filled-in template ' + (MODE === \"builder\" ? \"above\" : \"\") + ' and click Build my dashboard.<\/div>';\n    return tellHeight();\n  }\n  D = parse(raw);\n  app.innerHTML = header(D) + warnings(problems(D)) + tiles(D) + filters(D) + timeline(D) + '<div class=\"two\">' + risks(D) + actions(D) + '<\/div>' + decision(D) + dataBox(raw, D);\n  tellHeight();\n}\n\n/* ---------- 4. Builder mode: paste, build, download ---------- */\nlet CURRENT = RAW;\nfunction toast(t){ const d = document.createElement(\"div\"); d.className = \"toast\"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }\nfunction store(v){ try { localStorage.setItem(SAVE_KEY, v); } catch(e){} }\nfunction restore(){ try { return localStorage.getItem(SAVE_KEY) || \"\"; } catch(e){ return \"\"; } }\nfunction setupBuilder(){\n  const b = document.getElementById(\"builder\");\n  b.hidden = false;\n  b.innerHTML = '<div class=\"eyebrow\">Dashboard builder<\/div><h2 style=\"font-size:20px;margin:4px 0 8px\">Make your dashboard with any AI chat<\/h2>' +\n    '<ol><li>Copy the prompt. It has the dashboard template in it. <button class=\"btn ghost\" data-act=\"copyprompt\">Copy the prompt<\/button><\/li>' +\n    '<li>Paste it into your project chat: ChatGPT, Copilot, Claude, Gemini or another AI. Add what you fixed where it says so.<\/li>' +\n    '<li>Copy the AI\\'s filled-in template, paste it here, and click Build my dashboard.<\/li><\/ol>' +\n    '<label class=\"small ink2\" for=\"input\">The AI\\'s filled-in template<\/label><textarea id=\"input\" spellcheck=\"false\"><\/textarea>' +\n    '<div class=\"row\"><button class=\"btn\" data-act=\"build\">Build my dashboard<\/button><button class=\"btn ghost\" data-act=\"download\">Download my dashboard<\/button>' +\n    (EXAMPLE ? '<button class=\"btn ghost\" data-act=\"example\">Load the bakery example<\/button>' : \"\") + '<\/div>';\n  const saved = restore();\n  CURRENT = saved || RAW || \"\";\n  document.getElementById(\"input\").value = CURRENT;\n}\nasync function copyText(t){\n  try { await navigator.clipboard.writeText(t); toast(\"Copied. Paste it into your AI chat.\"); }\n  catch(e){ const a = document.createElement(\"textarea\"); a.value = t; document.body.appendChild(a); a.select();\n    try { document.execCommand(\"copy\"); toast(\"Copied. Paste it into your AI chat.\"); } catch(_){ toast(\"Select the text and press Ctrl+C.\"); } a.remove(); }\n}\n/* The download is this same page, in view mode, with the data inside. */\nfunction pageWith(raw){\n  const clone = document.documentElement.cloneNode(true);\n  clone.querySelector(\"#app\").innerHTML = \"\"; clone.querySelector(\"#builder\").innerHTML = \"\"; clone.querySelector(\"#builder\").hidden = true;\n  clone.querySelectorAll(\".toast\").forEach(e => e.remove());\n  clone.classList.remove(\"x\"); if (clone.querySelector(\"body\")) clone.querySelector(\"body\").className = \"\";\n  const safe = s => JSON.stringify(s).replace(/<\/g, \"\\\\u003c\");\n  let html = \"<!doctype html>\\n\" + clone.outerHTML;\n  html = html.replace(/\\/\\*DATA_START\\*\\/[\\s\\S]*?\\/\\*DATA_END\\*\\//, () => \"/*DATA_START*/\" + safe(raw) + \"/*DATA_END*/\")\n             .replace(/\\/\\*MODE_START\\*\\/[\\s\\S]*?\\/\\*MODE_END\\*\\//, () => '/*MODE_START*/\"view\"/*MODE_END*/');\n  return html;\n}\nfunction download(raw){\n  const blob = new Blob([pageWith(raw)], {type: \"text/html\"});\n  const url = URL.createObjectURL(blob), a = document.createElement(\"a\");\n  a.href = url; a.download = \"My_Project_Dashboard.html\"; document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 4000); toast(\"Downloading My_Project_Dashboard.html\");\n}\n\n/* ---------- 5. Clicks, hover and height ---------- */\nconst tipEl = document.getElementById(\"tip\");\nfunction showTip(el, x, y){\n  tipEl.textContent = el.getAttribute(\"data-tip\"); tipEl.style.display = \"block\";\n  const r = tipEl.getBoundingClientRect();\n  let left = x + 14, top = y + 14;\n  if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;\n  if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;\n  tipEl.style.left = Math.max(8, left) + \"px\"; tipEl.style.top = Math.max(8, top) + \"px\";\n}\ndocument.addEventListener(\"mousemove\", e => { const el = e.target.closest(\"[data-tip]\"); if (el) showTip(el, e.clientX, e.clientY); else tipEl.style.display = \"none\"; });\ndocument.addEventListener(\"focusin\", e => { const el = e.target.closest(\"[data-tip]\"); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + r.width / 2, r.bottom); } });\ndocument.addEventListener(\"focusout\", () => { tipEl.style.display = \"none\"; });\ndocument.addEventListener(\"click\", e => {\n  const b = e.target.closest(\"button\"); if (!b) return;\n  const a = b.dataset;\n  if (a.owner) { OWNER = a.owner; draw(CURRENT); }\n  if (a.risk) { RISK = a.risk; draw(CURRENT); }\n  if (a.option !== undefined) { OPTION = +a.option; draw(CURRENT); }\n  if (a.act === \"math\") { document.body.classList.toggle(\"show-math\"); draw(CURRENT); }\n  if (a.act === \"table\") { TABLE = !TABLE; draw(CURRENT); }\n  if (a.act === \"print\") window.print();\n  if (a.act === \"copyprompt\") copyText(PROMPT);\n  if (a.act === \"build\") { CURRENT = document.getElementById(\"input\").value; store(CURRENT); OWNER = \"All\"; draw(CURRENT); document.getElementById(\"app\").scrollIntoView({behavior: \"smooth\"}); }\n  if (a.act === \"download\") { CURRENT = document.getElementById(\"input\").value; if (!CURRENT.trim()) return toast(\"Paste the AI's filled-in template first.\"); store(CURRENT); download(CURRENT); }\n  if (a.act === \"example\") { document.getElementById(\"input\").value = EXAMPLE; CURRENT = EXAMPLE; draw(CURRENT); }\n});\nfunction tellHeight(){\n  if (MODE !== \"embed\") return;\n  // Measure the content itself, not the page: the page is never shorter than the frame, so measuring it\n  // would make the frame grow a little more every time the web lab resized it.\n  requestAnimationFrame(() => { try { parent.postMessage({type: \"dash-height\", h: Math.ceil(document.querySelector(\".wrap\").getBoundingClientRect().height)}, \"*\"); } catch(e){} });\n}\nwindow.addEventListener(\"resize\", tellHeight);\n/* The web lab sends new data with postMessage, so it can rebuild without reloading the frame. */\nwindow.addEventListener(\"message\", e => { if (e.data && e.data.type === \"dash-data\") { CURRENT = String(e.data.raw || \"\"); OWNER = \"All\"; draw(CURRENT); } });\n\nif (MODE === \"embed\") document.body.classList.add(\"embed\");\nif (MODE === \"builder\") setupBuilder();\ndraw(CURRENT);\n<\/script>\n<\/body>\n<\/html>\n", "dash_example": "PROJECT: Maple Street Bakery website\nSPONSOR: Maria, the owner\nWEEK: 6 | 9\nSTATUS: Yellow | The design was one week late and the photos are late, but the buffer week can still save the launch at the end of week 9.\nBUDGET: 8000 | 4900 | 800\nAI COUNTS: 8 | 17 | 61\nTASK: T1 | Write the project charter | Project manager | 1 | 1 | Done\nTASK: T2 | Agree scope, schedule and budget with Maria | Maria | 2 | 2 | Done\nTASK: T3 | Collect example websites Maria likes | Project manager | 2 | 2 | Done\nTASK: T4 | Create two homepage designs | Sam | 3 | 3 | Done\nTASK: T5 | Review and approve the design | Maria | 4 | 4 | Done\nTASK: T6 | Write the menu and prices | Jo | 3 | 4 | Done\nTASK: T7 | Write the About story and contact details | Jo | 4 | 5 | Done\nTASK: T8 | Take cake and shop photos | Jo | 4 | 5 | Not started\nTASK: T9 | Approve all text and photos | Maria | 6 | 6 | Not started\nTASK: T10 | Set up hosting, domain and form tool | Sam | 5 | 5 | Done\nTASK: T11 | Build the 5 pages | Sam | 5 | 6 | In progress\nTASK: T12 | Build the cake request form with an allergy question | Sam | 6 | 6 | Not started\nTASK: T13 | Test on phones and computers | Project manager | 7 | 7 | Not started\nTASK: T14 | Send a test cake request | Jo | 7 | 7 | Not started\nTASK: T15 | Fix problems found in testing | Sam | 7 | 7 | Not started\nTASK: T16 | Final approval | Maria | 9 | 9 | Not started\nTASK: T17 | Go live and announce (flyers, shop sign) | Project manager | 9 | 9 | Not started\nMILESTONE: Plan approved | 2 | 2 | Done\nMILESTONE: Design approved | 4 | 5 | Done\nMILESTONE: Content ready | 6 | 7 | At risk\nMILESTONE: Site tested | 7 | 8 | At risk\nMILESTONE: Launch | 9 | 9 | On track\nRISK: R1 | Approvals are slow | 3 | 2 | Book every Monday slot now; send a review pack every Friday | Project manager\nRISK: R2 | Text and photos are late | 3 | 2 | Start content in week 3; give Jo a fill-in template; plan a Saturday photo session | Project manager\nRISK: R3 | New feature requests (scope creep) | 2 | 3 | Every new request goes through a change request | Project manager\nRISK: R4 | Sam is not available | 2 | 3 | Agree dates in Sam's contract; ask for a backup contact | Maria\nRISK: R5 | Nobody sees cake requests | 2 | 2 | Send requests to the shop email and add a daily check | Jo\nRISK: R6 | The site looks bad on phones | 1 | 3 | Test on 3 phones in week 7 | Project manager\nRISK: R7 | Costs are higher than estimated | 2 | 1 | Get real quotes in week 2; keep the contingency | Project manager\nRISK: R8 | The web address is taken | 1 | 2 | Check the name in week 1 and have two backups | Sam\nACTION: Take the cake photos | Jo | Saturday morning, week 7\nACTION: Build the last 2 pages and the cake form | Sam | Week 7\nACTION: Decide on online payment | Maria | (?)\nDECISION: Should customers be able to pay for cakes online? (see the change request)\nOPTION: Launch in week 9 without online payment, and add it later as phase 2 | 0 | 9 | Recommended\nOPTION: Add online payment now | 1200 | 11 |\nOPTION: Do not add online payment | 0 | 9 |", "fills": {"[paste the dashboard template]": "# PROJECT DASHBOARD TEMPLATE\n# Fill in every line from our project. Keep each label and its colon, and keep the | marks between parts.\n# Write numbers only: no $ signs, no commas, no % signs. Write one TASK, MILESTONE, RISK, ACTION or OPTION line per item.\nPROJECT: <project name>\nSPONSOR: <the sponsor's name or role>\nWEEK: <this week> | <total weeks in the plan>\nSTATUS: <Green, Yellow or Red> | <one sentence: why>\nBUDGET: <approved budget> | <spent so far> | <contingency>\nAI COUNTS: <how many tasks are Done> | <how many tasks in total> | <percent of the budget used>\nTASK: <ID> | <task> | <owner> | <start week> | <end week> | <Done, In progress or Not started>\nMILESTONE: <milestone> | <planned week> | <actual or forecast week> | <Done, On track, At risk or Late>\nRISK: <ID> | <risk> | <likelihood 1 to 3> | <impact 1 to 3> | <response> | <owner>\nACTION: <open action> | <owner> | <due>\nDECISION: <what the sponsor must decide>\nOPTION: <the option, in a few words> | <extra cost on top of the plan> | <launch week> | <Recommended, or leave empty>", "[paste the schedule template]": "# SCHEDULE TEMPLATE: Maple Street Bakery website\n# Fill in this table from our task list. Reply with only the filled-in table.\n# Keep the four columns and their names exactly as they are.\n# Write one row for every task in our task list, in the same order, with the same ID and the same task name.\n# Then write the five milestone rows exactly as they are below. Fill in the weeks only.\n# Weeks are numbers from 1 to 9, like 3 (not \"Week 3\"). A milestone starts and ends in the same week.\n# A task where Maria reviews or approves something starts the week after the work it reviews ends (she reviews only on Mondays).\n# Building starts after the design is approved.\n# Week 8 is the buffer week: plan no task in week 8 at all. Finish testing by week 7. Only the final approval and the launch go in week 9.\n# Do not write a row for the buffer.\n# Write no other rows: no buffer row, no notes, no totals.\n| ID | Task or milestone | Start week | End week |\n|---|---|---|---|\n| T1 | <task T1, as in the task list> | <week> | <week> |\n| T2 | <task T2, as in the task list> | <week> | <week> |\n| ... | <one row for every task in the task list> | <week> | <week> |\n| M1 | Milestone: Plan approved | <week> | <same week> |\n| M2 | Milestone: Design approved | <week> | <same week> |\n| M3 | Milestone: Content ready | <week> | <same week> |\n| M4 | Milestone: Site tested | <week> | <same week> |\n| M5 | Milestone: Launch | 9 | 9 |", "[paste Maria's answers]": "Maria's answers to the project manager's questions.\n- Success means: the website is live by the end of week 9, it costs no more than $8,000, and the first online cake request comes in during the first month.\n- The $8,000 must cover everything: Sam's work, hosting and the web address for one year, and a 10% contingency ($800).\n- Not in this project: online payment, delivery, a loyalty programme, social media.\n- The website must work well on phones. Most customers will look at it on their phone.\n- I want short instructions so I can change the menu prices myself.\n- I will sign the charter in week 2.\n- Anything else: I do not know yet. Write TO CONFIRM and ask me on Monday.", "[paste the meeting notes]": "Website meeting, week 3, Monday.\n- Sam showed two homepage designs. Maria likes design B but wants a bigger photo of the cakes.\n- Sam will send the updated design by Thursday.\n- Jo said she might be able to take the cake photos this week if the shop is quiet.\n- Nobody has the final menu prices yet. Maria said \"someone should get those from the kitchen\".\n- Maria wants the cake order form to ask about allergies.\n- Next meeting: next Monday.", "[paste the colour rules]": "Green: on schedule and on budget.\nYellow: something is late or at risk, but we can still meet the deadline and budget.\nRed: we will miss the deadline or the budget unless someone makes a decision.", "[paste the week 6 update]": "Week 6 updates.\n- The plan was approved in week 2, on time. All the Plan tasks are finished.\n- The design was approved in week 5. The plan said week 4, so it is one week late.\n- Sam set up the hosting and the web address in week 5.\n- The menu text and the About text are done.\n- The cake photos are not taken yet. Jo was sick for 3 days.\n- Sam has built 3 of the 5 pages.\n- Money spent so far: $4,900 of $8,000.\n- Next week: Sam builds the last 2 pages and the cake form. Jo will take the cake photos on Saturday morning, before the shop opens.\n- On Monday Maria asked: \"Can customers pay for cakes online too?\"\n- The launch is still planned for the end of week 9.", "[paste the payment facts]": "Sam estimates that online payment adds about $1,200 and 2 weeks of work.\nThe total budget is $8,000 and $4,900 is spent. The 10% contingency is $800.\nThe launch is planned for the end of week 9.", "[paste the end-of-project notes]": "End-of-project notes.\n- The website went live at the end of week 9, on time.\n- Final cost: $7,650. Online payment was moved to a later phase.\n- The cake photos were late because Jo had no time in the shop. We fixed it with a photo session on Saturday morning before opening.\n- Maria's Monday-only reviews made the design approval one week late.\n- The first online cake request came in on day 3."}};

  return {view:"start", name:"", ticks:{}, ans:{}, quiz:{}, rate:{}, decision:{}, changed:{}, evala:{}, finala:{}, found:{}, revealed:{}, verdict:{}, event:null, eventKind:null, eventa:{}, dash:{}};
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
async function copy(t){
  try { await navigator.clipboard.writeText(t); toast("Copied. Paste it into ChatGPT or Copilot."); }
  catch(e){ const a=document.createElement("textarea"); a.value=t; document.body.appendChild(a); a.select();
    try{ document.execCommand("copy"); toast("Copied. Paste it into ChatGPT or Copilot."); }catch(_){ toast("Select the text and press Ctrl+C"); } a.remove(); }
}

/* Everyone uses the same bakery card, so it always comes from DATA and cannot be changed. */
const cardText = () => DATA.card.map(([k, v]) => k + ": " + v).join("\n");
function filled(prompt){
  let t = prompt.split("[paste your project card]").join(cardText());
  for (const [k,v] of Object.entries(DATA.fills)) t = t.split(k).join(v);
  const ev = currentEvent();
  t = t.split("[paste the event card]").join(ev ? ev.text : "[paste the event card]");
  return t;
}

/* The quiz: click an option to see if it is right, and why. */
function quizHtml(n){
  const qs = DATA.quiz[String(n)] || []; if (!qs.length) return "";
  const done = qs.filter((q,i) => S.quiz[n+"-"+i] !== undefined).length;
  const right = qs.filter((q,i) => S.quiz[n+"-"+i] === q[2]).length;
  return '<h2>Quick check</h2><p>Click one answer for each question. <span class="score">'+right+' of '+qs.length+' correct</span>'+(done<qs.length?' <span class="muted">('+(qs.length-done)+' to go)</span>':'')+'</p>' +
  qs.map(([q, opts, correct, why], i) => { const k = n+"-"+i, pick = S.quiz[k];
    return '<div class="q"><div class="qt">'+(i+1)+'. '+esc(q)+'</div><div class="opts">' +
      opts.map((o, j) => '<button class="opt'+(pick!==undefined && j===correct?' right':'')+(pick===j && j!==correct?' wrong':'')+'" aria-pressed="'+(pick===j)+'" data-quiz="'+k+'" data-pick="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join("") + '</div>' +
      (pick!==undefined ? '<div class="feedback">'+(pick===correct?'<b class="ok">Correct.</b> ':'<b class="no">Not quite.</b> The answer is '+String.fromCharCode(65+correct)+'. ')+esc(why)+'</div>' : '') + '</div>';
  }).join("");
}
/* Hunt, then reveal: students write their own list of problems before they may see the checks.
   The AI gives different answers each time, so a check is not right or wrong for everyone.
   After Reveal, the student marks each check for THEIR AI answer: the AI got it right, or it got it
   wrong and they found it, or it got it wrong and they missed it. The score counts only real mistakes. */
const huntMarks = (n, lab) => lab.checks.map((c, i) => S.verdict[n+"-"+i] || null);
function huntScore(marks){
  const right = marks.filter(m => m === "right").length, found = marks.filter(m => m === "found").length,
        wrong = found + marks.filter(m => m === "missed").length;
  if (right + wrong === 0) return "";
  if (wrong === 0) return "The AI got all " + right + " right this time. Another chat may not. That is why we check every time.";
  return "The AI got " + right + " right and " + wrong + " wrong. You found " + found + " of its " + wrong + " mistakes before you looked.";
}
function huntHtml(n, lab){
  let h = '<h2>Hunt, then check</h2><p>' + esc(DATA.hunt) + '</p><p class="muted"><b>What to check:</b> ' + esc(lab.checked) + '.</p>' +
          textBox("found", String(n), "Problems I found before I looked", 4);
  if (!S.revealed[n]) return h + '<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn" data-reveal="'+n+'">Reveal the checks</button><span class="muted">You need to write something first. Found nothing? Type: nothing found.</span></div>';
  const marks = huntMarks(n, lab), done = marks.filter(Boolean).length;
  h += '<h3>The checks: what did your AI do?</h3><p class="muted">Look at your own AI answer for each check. Your marks will not match your neighbour\'s: the AI gives a different answer every time.</p>';
  h += lab.checks.map((c, i) => { const k = n + "-" + i;
    return '<div class="rate"><div class="hc-text">' + (i+1) + '. ' + esc(c) + '</div><div class="opts inline">' +
      DATA.verdicts.map(([v, label, meaning]) => '<button class="opt" title="' + esc(meaning) + '" aria-pressed="' + (S.verdict[k] === v) + '" data-verdict="' + k + '" data-val="' + v + '">' + esc(label) + '</button>').join("") +
      '</div></div>'; }).join("");
  const left = lab.checks.length - done;
  h += '<p style="margin-top:12px"><span class="score">' + (left ? left + " still to mark. " : "") + esc(huntScore(marks)) + '</span></p>';
  if (!left && marks.some(m => m !== "right")) h += '<p class="tip"><b>Next:</b> fix every check marked Wrong in your final version.</p>';
  h += '<p class="tip" style="margin-bottom:16px"><b>Found a problem that is not on our list?</b> Good. It counts too. Keep it in your list above.</p>';
  return h;
}

/* ======================================================================
   EXPORT: build a list of blocks (headings, paragraphs, prompts), then
   turn it into a Word file or a PDF.
   ====================================================================== */
function labBlocks(lab){
  const n = lab.num, B = [];
  B.push(["h1", "Lab " + n + ": " + lab.title]);
  lab.steps.forEach(([instr, prompt], i) => {
    if (!prompt) return;
    B.push(["h3", "Step " + (i+1) + ". " + instr]);
    B.push(["label", "Prompt I used"]); B.push(["pre", filled(prompt)]);
    const a = (S.ans[n+"-"+i] || "").trim();
    B.push(["label", "The AI's answer"]); B.push(a ? ["pre", a] : ["p", "(not pasted)"]);
  });
  B.push(["h2", "My evaluation of the AI's answer"]);
  DATA.guide.forEach(([q], i) => B.push(["li", (i+1) + ". " + q + "  ->  " + (S.rate[n+"-"+i] || "not answered")]));
  B.push(["p", "Decision: " + (S.decision[n] !== undefined ? DATA.decision[S.decision[n]] : "not chosen")]);
  B.push(["label", "What I changed, and why"]); B.push(["p", (S.changed[String(n)] || "").trim() || "(blank)"]);
  if (n === 6) { B.push(["h2", "My dashboard data (the filled-in template)"]); B.push(((S.dash.text || "").trim()) ? ["pre", S.dash.text.trim()] : ["p", "(not pasted)"]); }
  B.push(["h2", "Hunt, then check"]);
  B.push(["label", "Problems I found before I looked"]); B.push(["p", (S.found[String(n)] || "").trim() || "(blank)"]);
  if (S.revealed[n]) {
    B.push(["label", "The checks, marked for my AI answer (" + lab.checked + ")"]);
    lab.checks.forEach((c, i) => { const m = S.verdict[n+"-"+i];
      B.push(["li", (i+1) + ". " + c + "  ->  " + (m ? DATA.verdicts.find(v => v[0] === m)[1] : "not marked")]); });
    const sc = huntScore(huntMarks(n, lab)); if (sc) B.push(["p", sc]);
  } else B.push(["p", "(checks not revealed yet)"]);
  const qs = DATA.quiz[String(n)] || [];
  if (qs.length){
    const right = qs.filter((q,i) => S.quiz[n+"-"+i] === q[2]).length;
    B.push(["h2", "Quick check: " + right + " of " + qs.length + " correct"]);
    qs.forEach(([q, opts, correct], i) => { const p = S.quiz[n+"-"+i];
      B.push(["li", (i+1) + ". " + q + "  My answer: " + (p !== undefined ? opts[p] : "not answered") + (p === undefined ? "" : p === correct ? "  (correct)" : "  (correct answer: " + opts[correct] + ")")]); });
  }
  B.push(["h2", "Lab evaluation questions"]);
  lab.evalq.forEach((q, i) => { B.push(["label", (i+1) + ". " + q]); B.push(["p", (S.evala[n+"-"+i] || "").trim() || "(blank)"]); });
  return B;
}
function eventBlocks(){
  const ev = currentEvent(), B = [["h1", "Surprise event" + (ev ? ": card " + ev.num + ", " + ev.title : " (no card opened)")]];
  if (!ev) return B;
  B.push(["pre", ev.text]);
  B.push(["p", "What kind of problem: " + (S.eventKind !== null && S.eventKind !== undefined ? DATA.event_kinds[S.eventKind][0] : "not chosen")]);
  B.push(["label", "Why"]); B.push(["p", (S.eventa.why || "").trim() || "(blank)"]);
  DATA.event_prompts.forEach((pr, i) => { B.push(["label", "Prompt " + (i+1)]); B.push(["pre", filled(pr)]);
    const a = (S.ans["event-"+i] || "").trim(); B.push(["label", "The AI's answer"]); B.push(a ? ["pre", a] : ["p", "(not pasted)"]); });
  B.push(["label", "What we changed in Excel"]); B.push(["p", (S.eventa.excel || "").trim() || "(blank)"]);
  B.push(["label", "Our message to Maria"]); B.push(["p", (S.eventa.message || "").trim() || "(blank)"]);
  return B;
}
function allBlocks(scope){
  const B = [["title", "My AI PM work: " + DATA.subtitle], ["p", "Name: " + (S.name.trim() || "(no name)")], ["p", "Downloaded: " + new Date().toLocaleString()]];
  B.push(["h1", "The project card"]); B.push(["pre", cardText()]);
  const labs = scope === "all" ? DATA.labs : DATA.labs.filter(l => String(l.num) === String(scope));
  labs.forEach(l => { B.push(...labBlocks(l)); if (scope === "all" && l.num === 5) B.push(...eventBlocks()); });
  if (scope === "all"){
    B.push(["h1", "Final evaluation"]);
    DATA.final.forEach((q, i) => { B.push(["label", (i+1) + ". " + q]); B.push(["p", (S.finala[String(i)] || "").trim() || "(blank)"]); });
    B.push(["h2", "What I can do now"]);
    DATA.skills.forEach((s, i) => B.push(["li", (S.ticks["skills-"+i] ? "[x] " : "[ ] ") + s]));
  }
  return B;
}

/* --- Word (.docx): a .docx is a zip of a few XML files. --- */
const xmlEsc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
function wRun(text, o){
  o = o || {};
  const rPr = '<w:rPr>' + (o.font ? '<w:rFonts w:ascii="'+o.font+'" w:hAnsi="'+o.font+'"/>' : '') + (o.bold ? '<w:b/>' : '') + (o.color ? '<w:color w:val="'+o.color+'"/>' : '') + (o.size ? '<w:sz w:val="'+o.size+'"/>' : '') + '</w:rPr>';
  return String(text).split("\n").map((line, i) => (i ? '<w:r>'+rPr+'<w:br/></w:r>' : '') + '<w:r>' + rPr + '<w:t xml:space="preserve">' + xmlEsc(line) + '</w:t></w:r>').join("");
}
function wPara(text, o, pPr){ return '<w:p><w:pPr>' + (pPr || '') + '<w:spacing w:after="120"/></w:pPr>' + wRun(text, o) + '</w:p>'; }
async function buildDocx(blocks){
  let firstH1 = true;
  const body = blocks.map(([t, x]) => {
    if (t === "title") return wPara(x, {bold:true, size:36});
    if (t === "h1") { const brk = firstH1 ? '' : '<w:pageBreakBefore/>'; firstH1 = false; return wPara(x, {bold:true, size:30, color:"C8102E"}, brk + '<w:keepNext/>'); }
    if (t === "h2") return wPara(x, {bold:true, size:26}, '<w:keepNext/>');
    if (t === "h3") return wPara(x, {bold:true, size:22}, '<w:keepNext/>');
    if (t === "label") return wPara(x, {bold:true, size:18, color:"5F5F5F"}, '<w:keepNext/>');
    if (t === "pre") return wPara(x, {font:"Consolas", size:18}, '<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/><w:ind w:left="200"/>');
    if (t === "li") return wPara(x, {}, '<w:ind w:left="300"/>');
    return wPara(x);
  }).join("");
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body +
    '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1200" w:right="1200" w:bottom="1200" w:left="1200" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>';
  const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/><w:sz w:val="21"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>';
  const zip = new JSZip();
  zip.file("[Content_Types].xml", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
  zip.file("_rels/.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/_rels/document.xml.rels", '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  zip.file("word/document.xml", doc);
  zip.file("word/styles.xml", styles);
  return zip.generateAsync({type:"blob", compression:"DEFLATE", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* --- PDF: write the same blocks line by line with jsPDF. --- */
const pdfSafe = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/·/g, "-").replace(/…/g, "...").replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g, "");
function buildPdf(blocks){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({unit:"pt", format:"letter"});
  const L = 54, W = 612 - 2*L, BOTTOM = 792 - 54;
  let y = 60;
  const need = h => { if (y + h > BOTTOM) { pdf.addPage(); y = 60; } };
  function write(text, size, style, font, color, indent, gapAfter){
    pdf.setFont(font || "helvetica", style || "normal"); pdf.setFontSize(size); pdf.setTextColor(color || "#111111");
    const lines = pdf.splitTextToSize(pdfSafe(text), W - (indent || 0));
    const lh = size * 1.35;
    lines.forEach(line => { need(lh); pdf.text(line, L + (indent || 0), y); y += lh; });
    y += gapAfter || 4;
  }
  blocks.forEach(([t, x], idx) => {
    if (t === "title") write(x, 18, "bold", null, null, 0, 8);
    else if (t === "h1") { if (idx > 3) { pdf.addPage(); y = 60; } write(x, 16, "bold", null, "#C8102E", 0, 6); }
    else if (t === "h2") { y += 6; write(x, 13, "bold", null, null, 0, 4); }
    else if (t === "h3") { y += 4; write(x, 11, "bold", null, null, 0, 2); }
    else if (t === "label") write(x, 9, "bold", null, "#5F5F5F", 0, 2);
    else if (t === "pre") write(x, 9, "normal", "courier", null, 10, 8);
    else if (t === "li") write(x, 10.5, "normal", null, null, 12, 2);
    else write(x, 10.5, "normal", null, null, 0, 6);
  });
  return pdf.output("blob");
}

/* --- Hand the file to the viewer: the Claude viewer's download prompt, or a normal browser download. --- */
let downloadsApi = null;
(async () => { try { downloadsApi = await window.claude?.use?.("downloads"); } catch(e){ downloadsApi = null; } })();
async function exportWork(scope, fmt){
  const who = (S.name.trim() || "student").replace(/[^A-Za-z0-9]+/g, "_");
  const filename = "AI_PM_Labs_" + who + "_" + (scope === "all" ? "all_labs" : "lab_" + scope) + "." + fmt;
  let blob;
  try {
    if (fmt === "docx") { if (!window.JSZip) throw new Error("The Word maker did not load. Check the internet connection and reload."); blob = await buildDocx(allBlocks(scope)); }
    else { if (!window.jspdf) throw new Error("The PDF maker did not load. Check the internet connection and reload."); blob = buildPdf(allBlocks(scope)); }
  } catch(e) { toast(e.message || "Could not build the file."); return; }
  saveBlob(blob, filename);
}
async function saveBlob(blob, filename){
  if (downloadsApi) {
    try { await downloadsApi.save({filename, data: blob}); toast("Saved " + filename); }
    catch(e) { if (e && e.code === "declined") toast("Download cancelled."); else toast("Downloads are not available here."); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Downloading " + filename);
}

/* ======================================================================
   LAB 6: THE DASHBOARD BUILDER
   The student pastes the AI's filled-in dashboard template. The dashboard page (the same one as
   10_Project_Dashboard_TEMPLATE.html) draws it inside a frame, so it works with any AI's answer.
   ====================================================================== */
const jsString = t => JSON.stringify(String(t)).replace(/</g, "\\u003c");
function dashPage(raw, mode){
  return DATA.dash_page
    .replace(/\/\*DATA_START\*\/[\s\S]*?\/\*DATA_END\*\//, () => "/*DATA_START*/" + jsString(raw) + "/*DATA_END*/")
    .replace(/\/\*MODE_START\*\/[\s\S]*?\/\*MODE_END\*\//, () => "/*MODE_START*/" + JSON.stringify(mode) + "/*MODE_END*/");
}
function dashBuilderHtml(){
  return '<h2>Dashboard builder</h2><p>Paste the AI\'s filled-in template here, then click <b>Build my dashboard</b>. It works with the answer from any AI chat. A red box means the AI\'s own numbers do not add up.</p>' +
    textBox("dash", "text", "The AI's filled-in template", 8).replace("<textarea", '<textarea class="mono" spellcheck="false"') +
    '<div class="row" style="justify-content:flex-start;margin-top:8px"><button class="btn" data-dashbuild="1">Build my dashboard</button><button class="btn ghost" data-dashdownload="1">Download my dashboard</button></div>' +
    (S.dash.built ? '<iframe class="dashframe" data-dashframe="mine" title="My project dashboard" sandbox="allow-scripts"></iframe>' : '');
}
function dashExampleHtml(){
  if (!S.revealed[6]) return '<h2>Our example dashboard</h2><p class="muted">Our example for the bakery opens here after you reveal the checks. Make yours first.</p>';
  return '<h2>Our example dashboard</h2><p>The bakery at week 6, made from the same template. Compare it with yours: the numbers, the colour, the risks and the decision.</p>' +
    (S.dash.example ? '<iframe class="dashframe" data-dashframe="example" title="Example project dashboard" sandbox="allow-scripts"></iframe>'
                    : '<button class="btn ghost" data-dashexample="1">Show the example dashboard</button>');
}
function mountDash(){
  document.querySelectorAll("iframe[data-dashframe]").forEach(f => {
    const raw = f.dataset.dashframe === "example" ? DATA.dash_example : (S.dash.built || "");
    f.srcdoc = dashPage(raw, "embed");
  });
}
/* The dashboard frame tells us how tall it is, so it never needs its own scroll bar. */
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "dash-height") return;
  document.querySelectorAll("iframe[data-dashframe]").forEach(f => {
    if (f.contentWindow !== e.source) return;
    const want = e.data.h + 4;
    if (Math.abs((parseFloat(f.style.height) || 0) - want) > 2) f.style.height = want + "px";   // only when it really changed
  });
});

/* ======================================================================
   CLICKS AND TYPING
   ====================================================================== */
let confirmClear = false;
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go){ S.view = d.go; save(); render(); window.scrollTo(0,0); try{ location.hash = S.view; }catch(_){} return; }
  if (d.copy) copy(filled(PROMPTS[d.copy]));
  if (d.copytext === "card") copy(cardText());
  if (d.quiz){ S.quiz[d.quiz] = +d.pick; save(); rerender(); }
  if (d.rate){ S.rate[d.rate] = d.val; save(); rerender(); }
  if (d.decision){ S.decision[d.decision] = +d.pick; save(); rerender(); }
  if (d.export) exportWork(d.export, d.fmt);
  if (d.reveal){
    if (!(S.found[d.reveal] || "").trim()) { toast("Write what you found first. Found nothing? Type: nothing found."); const box = document.getElementById("found-" + d.reveal); if (box) box.focus(); return; }
    S.revealed[d.reveal] = true; save(); rerender(); toast("Now tick the checks you caught.");
  }
  if (d.openevent){
    const v = parseInt(($("#evnum") || {}).value, 10);
    if (!DATA.events.some(e => e.num === v)) { toast("Type the card number from your instructor (1 to " + DATA.events.length + ")."); return; }
    S.event = v; save(); rerender();
  }
  if (d.verdict){ S.verdict[d.verdict] = d.val; save(); rerender(); }
  if (d.dashbuild){
    if (!(S.dash.text || "").trim()) { toast("Paste the AI's filled-in template first."); return; }
    S.dash.built = S.dash.text; save(); rerender(); toast("Dashboard built. Check every number against Excel.");
  }
  if (d.dashdownload){
    if (!(S.dash.text || "").trim()) { toast("Paste the AI's filled-in template first."); return; }
    const who = (S.name.trim() || "student").replace(/[^A-Za-z0-9]+/g, "_");
    saveBlob(new Blob([dashPage(S.dash.text, "view")], {type: "text/html"}), "Project_Dashboard_" + who + ".html");
  }
  if (d.dashexample){ S.dash.example = true; save(); rerender(); }
  if (d.dltemplate){
    const [n, j] = d.dltemplate.split("-"), [t, x] = DATA.inputs[n][+j];
    saveBlob(new Blob([x + "\n"], {type: "text/plain"}), DATA.template_files[t]);
  }
  if (d.eventkind !== undefined){ S.eventKind = +d.eventkind; save(); rerender(); }
  if (d.clearall){
    if (!confirmClear){ confirmClear = true; b.textContent = "Click again to clear everything"; setTimeout(() => { confirmClear = false; }, 4000); return; }
    S = freshState(); save(); render(); window.scrollTo(0,0); toast("Your work was cleared from this browser.");
  }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.name){ S.name = t.value; save(); }
  if (d.store){ S[d.store][d.key] = t.value; save(); }
  if (d.tick){ S.ticks[d.tick] = t.checked; save(); }
});
const h0 = (location.hash || "").slice(1); if (VIEWS.some(x => x[0] === h0)) S.view = h0;
render();
</script>
